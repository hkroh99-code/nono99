<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LHC 가상 운전실 모의실험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../assets/css/sim.css">
<style>
  /* 이 모의실험 전용 보조 스타일 (sim.css 변수만 사용) */
  .st-wrap { overflow-x: auto; border: 1px solid var(--s-line); border-radius: 7px; }
  .st { border-collapse: collapse; width: 100%; font-size: .7rem; }
  .st th, .st td { padding: .3rem .2rem; border-bottom: 1px solid var(--s-line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .st th { background: var(--s-panel-2); color: var(--s-ink-2); font-weight: 700; }
  .st td { font-family: var(--font-mono); }
  .st td:first-child, .st th:first-child { text-align: left; font-family: var(--font-body); font-weight: 600; white-space: normal; }
  .st td .note { font-size: .7rem; font-weight: 400; white-space: nowrap; }
  .st tr:last-child td { border-bottom: 0; }
  .st tbody tr { cursor: pointer; }
  .st tbody tr:hover td { background: rgba(127, 156, 255, .08); }
  .st tr.cur td { background: rgba(240, 163, 94, .16); color: var(--s-ink); }
  .hud b { color: var(--s-track); font-weight: 600; }
  .tech { font-size: .84rem; color: var(--s-ink-2); background: var(--s-panel-2); border-radius: 7px; padding: .45rem .6rem; }
  .tech b { color: var(--s-track); }
  .readout .v { font-size: .95rem; }
  @media (max-width: 860px) { .wide-only { display: none; } }
</style>
</head>
<body>
<div class="sim">
  <header class="sim-head">
    <span class="tag">주제 08 · 3D</span>
    <h1>LHC 가상 운전실</h1>
    <nav aria-label="관련 자료">
      <a href="../students/t08.html">학생용 활동지</a>
      <a href="../teachers/t08.html">교사용 지도서</a>
      <a href="index.html">모의실험 목록</a>
    </nav>
  </header>
  <div class="sim-body">
    <div class="stage" id="stage">
      <div class="stage-overlay" id="overlay">
        <div class="hud" id="hud-main"></div>
        <div class="hud" id="hud-val"></div>
        <div class="hud" id="hud-scale"></div>
      </div>
      <div class="stage-hint">드래그: 회전 · 휠/두 손가락: 확대 · 오른쪽 드래그: 이동</div>
    </div>
    <aside class="panel" id="panel" aria-label="조작과 기록"></aside>
  </div>
</div>
<script src="../assets/vendor/three/three.min.js"></script>
<script src="../assets/vendor/three/OrbitControls.js"></script>
<script src="../assets/js/sim-kit.js"></script>
<script>
(function () {
  "use strict";
  var THREE = window.THREE, K = window.SimKit, ui = K.ui, COL = K.COLORS;
  var sim = K.create({ stage: document.getElementById("stage"), cameraPos: [0, 14, 22], target: [0, 0, -4], grid: false, far: 20000 });
  var scene = sim.scene, panel = document.getElementById("panel");
  var c = K.C.c;
  var MP = K.C.mp_MeV / 1000, ME = K.C.me_MeV / 1000;    // GeV/c²
  var BEAM_I = 0.58;                                        // LHC 설계 빔 전류(A) — 복사 전력 계산용 가정
  var RF_LIMIT = 3.5;                                       // 회전당 보충 가능한 에너지(GeV) — LEP2 수준 가정

  /* ---------- 가속 사슬 자료 (K: 운동 에너지 GeV, 크기 m) ---------- */
  var STAGES = [
    { key: "linac", name: "Linac4", size: 86, K: 0.160, linear: true, note: "H⁻ 이온을 160 MeV까지 가속하는 선형가속기(길이 약 86 m)" },
    { key: "psb", name: "PS 부스터", size: 157, R: 25, K: 2, note: "입사 때 H⁻의 전자 2개를 벗겨 양성자로 만들고 2 GeV까지 가속(둘레 157 m, 고리 4개가 층층이)" },
    { key: "ps", name: "PS", size: 628, R: 100, K: 26, note: "양성자 싱크로트론(1959년 가동, 둘레 628 m). 26 GeV까지 가속하고 LHC용 묶음 간격(25 ns)을 만듦" },
    { key: "sps", name: "SPS", size: 6912, R: 1100, K: 450, note: "슈퍼 양성자 싱크로트론(둘레 6.9 km). 450 GeV까지 가속해 LHC 두 고리에 나눠 넣음" },
    { key: "lhc", name: "LHC", size: 26659, R: 4243, K: 6800, note: "대형 강입자 충돌기(둘레 26.7 km). 1232개 초전도 쌍극자석(8.3 T)으로 빔당 6.8 TeV까지 가속 후 충돌" }
  ];
  var KLAB = ["160 MeV", "2 GeV", "26 GeV", "450 GeV", "6.8 TeV"];
  STAGES.forEach(function (s, i) {
    s.Klabel = KLAB[i];
    s.gam = 1 + s.K / MP;
    s.beta = Math.sqrt(1 - 1 / (s.gam * s.gam));
    s.f = s.linear ? null : s.beta * c / s.size;
  });
  function gamOf(Kgev, m) { return 1 + Kgev / m; }
  function betaOf(g) { return Math.sqrt(Math.max(0, 1 - 1 / (g * g))); }
  function fmtE(gev) {
    if (gev >= 1000) return (gev / 1000).toFixed(gev >= 1e5 ? 0 : 2) + " TeV";
    if (gev >= 1) return gev.toFixed(gev >= 100 ? 1 : 2) + " GeV";
    return (gev * 1000).toFixed(gev * 1000 >= 100 ? 0 : 1) + " MeV";
  }
  function fmtBeta(b, extra) {
    if (b < 0.999) return b.toFixed(4);
    var n = Math.min(12, Math.ceil(-Math.log10(1 - b)) + (extra === undefined ? 2 : extra));
    return b.toFixed(n);
  }
  function fmtEV(ev) {   // 에너지(eV) → 알맞은 단위
    var u = [["TeV", 1e12], ["GeV", 1e9], ["MeV", 1e6], ["keV", 1e3], ["eV", 1]];
    if (ev >= 1e15) return K.fmt(ev / 1e9, 3) + " GeV";
    for (var i = 0; i < u.length; i++) if (ev >= u[i][1]) return K.fmt(ev / u[i][1], 3) + " " + u[i][0];
    return K.fmt(ev, 3) + " eV";
  }
  function fmtW(w) {
    var u = [["TW", 1e12], ["GW", 1e9], ["MW", 1e6], ["kW", 1e3], ["W", 1]];
    if (w >= 1e15) return K.fmt(w, 3) + " W";
    for (var i = 0; i < u.length; i++) if (w >= u[i][1]) return K.fmt(w / u[i][1], 3) + " " + u[i][0];
    return K.fmt(w, 3) + " W";
  }
  function fmtHz(f) { return f >= 1e6 ? (f / 1e6).toFixed(3) + " MHz" : (f >= 1e3 ? Math.round(f).toLocaleString("ko-KR") + " Hz" : f.toFixed(1) + " Hz"); }
  function fmtHzShort(f) { return f >= 1e6 ? (f / 1e6).toFixed(2) + " MHz" : (f / 1e3).toFixed(f >= 1e5 ? 0 : 1) + " kHz"; }

  /* ---------- 패널: 미션 ---------- */
  var mission = K.Mission(ui.section(panel, "미션"), { id: "t08", steps: [
    "<b>가속 사슬 따라가기</b> — [빔 주입 시작]을 눌러 양성자가 Linac4 → PS 부스터 → PS → SPS → LHC로 옮겨 가는 과정을 끝까지 지켜보기",
    "<b>단계별 γ·β</b> — 단계 표의 줄을 누르거나 애니메이션 중에 [단계 기록]을 눌러 5단계 모두의 에너지·γ·β를 기록하기",
    "<b>LHC 재현</b> — [설계 모드]에서 양성자, 휘는 반지름 ρ ≈ 2.8 km, B = 8.33 T로 맞춰 최대 빔 에너지 약 7 TeV 확인하기",
    "<b>FCC-hh 추정</b> — 둘레 약 91 km(반지름 약 14.5 km), B = 14~20 T인 양성자 가속기를 설계해 빔 에너지 추정하기",
    "<b>전자의 한계</b> — 같은 LHC 터널(ρ ≈ 2.8 km)에서 입자를 전자로 바꾸고, 회전당 복사 손실이 RF 보충 한계(3.5 GeV)를 넘는 설정을 찾아 [설계 기록]하기"
  ] });

  /* ---------- 패널: 모드 ---------- */
  var modeSec = ui.section(panel, "모드");
  var modeSel = ui.select(modeSec, { id: "mode", label: "운전실 화면", value: "chain", options: [
    { value: "chain", label: "가속 사슬 (Linac4 → LHC 빔 주입)" }, { value: "design", label: "설계 모드 (나만의 원형 가속기)" }
  ], onChange: function (v) { setMode(v); } });

  /* ---------- 패널: 가속 사슬 ---------- */
  var chainSec = ui.section(panel, "가속 사슬 조작");
  var scaleSel = ui.select(chainSec, { id: "scale", label: "화면 축척", value: "comp", options: [
    { value: "comp", label: "압축 축척 (화면 크기 ∝ 실제 크기^0.4)" }, { value: "real", label: "실제 비율 (격자 1칸 = 1 km)" }
  ], onChange: function () { buildChain(); restartBeam(false); } });
  var cr = ui.buttonRow(chainSec);
  ui.button(cr, { label: "빔 주입 시작", kind: "primary", onClick: function () { restartBeam(true); } });
  ui.button(cr, { label: "일시정지/재생", onClick: function () { sim.toggle(); } });
  ui.button(cr, { label: "전체 보기", onClick: function () { followTg.set(false); frameChain(); } });
  var followTg = ui.toggle(chainSec, { id: "follow", label: "카메라가 빔 따라가기", checked: true });
  var speedSl = ui.slider(chainSec, { id: "spd", label: "애니메이션 속도", min: 0.25, max: 3, step: 0.25, value: 1, unit: "배", format: function (v) { return v.toFixed(2); }, onInput: function (v) { sim.timeScale = v; } });
  var stageBox = ui.html(chainSec, "", "st-wrap");
  var stageNote = ui.html(chainSec, "", "note");
  ui.html(chainSec, '<p class="note">표의 줄을 누르면 그 단계로 바로 갑니다. 운동 에너지 K 기준: γ = 1 + K/(m<sub>p</sub>c²), β = √(1 − 1/γ²), 회전 주파수 f = βc / 둘레.</p>');
  var chainRo = ui.readouts(chainSec, [
    { key: "st", label: "현재 단계", unit: "" }, { key: "K", label: "운동 에너지 K", unit: "" },
    { key: "g", label: "로런츠 인자 γ", unit: "" }, { key: "b", label: "속력 β = v/c", unit: "" },
    { key: "omb", label: "1 − β", unit: "" }, { key: "dv", label: "빛보다 느린 정도 c − v", unit: "m/s" }
  ]);
  ui.button(chainSec, { label: "단계 기록", kind: "primary", onClick: recordStage });
  var recChain = K.Recorder(chainSec, { id: "t08-chain", columns: [
    { key: "st", label: "단계" }, { key: "K", label: "K", unit: "GeV", digits: 4 }, { key: "g", label: "γ", digits: 5 },
    { key: "b", label: "β" }, { key: "f", label: "회전 주파수", unit: "Hz", digits: 5 }
  ], onChange: checkChainMission });

  /* ---------- 패널: 설계 모드 ---------- */
  var desSec = ui.section(panel, "설계 모드 조작", "p [GeV/c] = 0.3 · B [T] · ρ [m] — 쌍극자석이 만드는 원의 반지름 ρ가 기준입니다.");
  var partSel = ui.select(desSec, { id: "part", label: "가속할 입자", value: "p", options: [
    { value: "p", label: "양성자 (938.3 MeV/c²)" }, { value: "e", label: "전자 (0.511 MeV/c²)" }
  ], onChange: function () { updateDesign(); } });
  var RSl = ui.slider(desSec, { id: "R", label: "링 반지름 R (기하학적)", min: 0.5, max: 16, step: 0.001, value: 4.243, unit: "km", format: function (v) { return v.toFixed(3); }, onInput: function () { rebuildRing(); updateDesign(); } });
  var fillSl = ui.slider(desSec, { id: "fill", label: "쌍극자석 채움 비율 ρ/R", min: 0.4, max: 1, step: 0.001, value: 0.661, unit: "", format: function (v) { return v.toFixed(3); }, onInput: function () { rebuildRing(); updateDesign(); } });
  var BSl = ui.slider(desSec, { id: "B", label: "쌍극자 자기장 B", min: 0.1, max: 20, step: 0.005, value: 2, unit: "T", format: function (v) { return v < 1 ? v.toFixed(3) : v.toFixed(2); }, onInput: function () { updateDesign(); } });
  var techBox = ui.html(desSec, "", "tech");
  ui.html(desSec, '<p class="note">채움 비율: LHC 둘레는 26.7 km(R ≈ 4.24 km)이지만 쌍극자석은 그중 약 2/3에만 있습니다. 나머지는 직선 구간(실험 장치, 가속 공동, 빔 버림 장치)과 빔을 모으는 사극자석입니다. 그래서 실제로 휘는 반지름은 ρ ≈ 2.80 km입니다.</p>');
  var pr = ui.buttonRow(desSec);
  ui.button(pr, { label: "SPS 값", onClick: function () { preset("p", 1.1, 0.674, 2.02); } });
  ui.button(pr, { label: "LEP 값 (전자)", onClick: function () { preset("e", 4.243, 0.713, 0.115); } });
  ui.button(pr, { label: "링에 맞춰 보기", onClick: function () { frameDesign(); } });
  var refTg = ui.toggle(desSec, { id: "ref", label: "기준 링 보기 (LHC 26.7 km, FCC 90.7 km)", checked: true, onChange: function (v) { refGroup.visible = v; } });
  var desRo = ui.readouts(desSec, [
    { key: "rho", label: "휘는 반지름 ρ", unit: "km" }, { key: "C", label: "둘레 C = 2πR", unit: "km" },
    { key: "E", label: "최대 빔 에너지 E", unit: "" }, { key: "Ecm", label: "충돌 에너지 (2E)", unit: "" },
    { key: "g", label: "로런츠 인자 γ", unit: "" }, { key: "f", label: "회전 주파수 f", unit: "" },
    { key: "U0", label: "회전당 복사 손실 U₀", unit: "" }, { key: "frac", label: "U₀ / E (한 바퀴 손실 비율)", unit: "" },
    { key: "Pw", label: "복사 전력 (빔 전류 0.58 A)", unit: "" }, { key: "nd", label: "쌍극자석 수 (14.3 m짜리)", unit: "개" }
  ]);
  var warnBox = ui.html(desSec, "", "note");
  var dPlot = document.createElement("canvas"); dPlot.className = "plot"; dPlot.setAttribute("aria-label", "빔 에너지에 따른 회전당 복사 손실 그래프"); desSec.appendChild(dPlot);
  ui.html(desSec, '<div class="legend"><span><i style="background:#ff6b6b"></i>양성자</span><span><i style="background:#3fb6ff"></i>전자</span><span><i style="background:#f0c060"></i>RF 보충 한계 3.5 GeV</span><span><i style="background:#5fd08a"></i>현재 설계</span></div><p class="note">세로축은 log₁₀(U₀ / eV): 눈금 1칸이 10배입니다. 같은 ρ에서 U₀ ∝ E⁴/m⁴.</p>');
  ui.button(desSec, { label: "설계 기록", kind: "primary", onClick: recordDesign });
  var recDes = K.Recorder(desSec, { id: "t08-design", columns: [
    { key: "part", label: "입자" }, { key: "R", label: "R", unit: "km", digits: 4 }, { key: "rho", label: "ρ", unit: "km", digits: 4 },
    { key: "B", label: "B", unit: "T", digits: 4 }, { key: "E", label: "E", unit: "TeV", digits: 4 }, { key: "U0", label: "U₀", unit: "keV", digits: 3 },
    { key: "f", label: "f", unit: "Hz", digits: 5 }
  ] });

  /* ---------- 3D: 가속 사슬 ---------- */
  var chainGroup = new THREE.Group(); scene.add(chainGroup);
  var layout = null;
  var gridReal = new THREE.GridHelper(200, 20, 0x2a3458, 0x161d33); gridReal.position.y = -0.05; scene.add(gridReal);
  function makeLabel(text, color, h) {
    var sp = K.label(text, { size: 40, color: color || "#e6e9f4" });
    sp.material.sizeAttenuation = false;
    var asp = sp.scale.x / sp.scale.y; h = h || 0.05;
    sp.scale.set(h * asp, h, 1);
    return sp;
  }
  function clearGroup(g) {
    while (g.children.length) {
      var o = g.children.pop();
      o.traverse(function (n) { if (n.geometry) n.geometry.dispose(); if (n.material) { if (n.material.map) n.material.map.dispose(); n.material.dispose(); } });
    }
  }
  function buildChain() {
    clearGroup(chainGroup);
    var real = scaleSel.get() === "real";
    var disp = function (m) { return real ? m / 100 : 0.42 * Math.pow(m, 0.4); };
    var gap = real ? 0.6 : 0.9;
    var L = {};
    STAGES.forEach(function (s) { s.Rd = s.linear ? 0 : disp(s.R); });
    var linLen = disp(STAGES[0].size);
    var x = 0;                                    // PSB 접점
    L.linac = [-gap - linLen, -gap];
    L.cx = [];
    L.cx[1] = 0;
    L.cx[2] = L.cx[1] + STAGES[1].Rd + gap + STAGES[2].Rd;
    L.cx[3] = L.cx[2] + STAGES[2].Rd + gap + STAGES[3].Rd;
    L.cx[4] = L.cx[3] + STAGES[3].Rd + gap + STAGES[4].Rd;
    var minX = L.linac[0], maxX = L.cx[4] + STAGES[4].Rd, off = -(minX + maxX) / 2;
    L.linac = [L.linac[0] + off, L.linac[1] + off];
    for (var i = 1; i < 5; i++) L.cx[i] += off;
    L.width = maxX - minX; L.real = real;
    // 선형가속기
    var linMat = new THREE.MeshStandardMaterial({ color: 0x9aa6c8, emissive: 0x223055, metalness: 0.3, roughness: 0.5, transparent: true, opacity: 0.35, depthWrite: false });
    var lin = new THREE.Mesh(new THREE.CylinderGeometry(real ? 0.05 : 0.12, real ? 0.05 : 0.12, linLen, 16), linMat);
    lin.rotation.z = Math.PI / 2; lin.position.set((L.linac[0] + L.linac[1]) / 2, 0, 0); chainGroup.add(lin);
    // 고리들
    var ringColors = [0, 0x5f7bd6, 0x6fb3d9, 0x7fd1b0, 0xf0a35e];
    for (var k = 1; k < 5; k++) {
      var s = STAGES[k], Rd = s.Rd;
      var tube = real ? Math.max(0.03, Rd * 0.012) : 0.05 + Rd * 0.02;
      var ring = new THREE.Mesh(new THREE.TorusGeometry(Rd, tube, 10, Math.max(48, Math.round(Rd * 24))),
        new THREE.MeshStandardMaterial({ color: ringColors[k], emissive: ringColors[k], emissiveIntensity: 0.25, roughness: 0.6 }));
      ring.rotation.x = Math.PI / 2; ring.position.set(L.cx[k], 0, -Rd); chainGroup.add(ring);
    }
    // 전송선(직선)
    var pts = [new THREE.Vector3(L.linac[1], 0, 0), new THREE.Vector3(L.cx[4], 0, 0)];
    chainGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x4a5578 })));
    // LHC 실험 지점
    var R4 = STAGES[4].Rd, cx4 = L.cx[4];
    [["ATLAS", 0], ["ALICE", Math.PI / 4], ["CMS", Math.PI], ["LHCb", -Math.PI / 4]].forEach(function (e) {
      var ph = e[1], p = new THREE.Vector3(cx4 + R4 * Math.sin(ph), 0, -(R4 - R4 * Math.cos(ph)));
      var box = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xe6e9f4, emissive: 0x444c66 }));
      var bs = real ? 0.9 : 0.45; box.scale.set(bs, bs, bs); box.position.copy(p); chainGroup.add(box);
      var lb = makeLabel(e[0], "#a9b0c8", 0.036); lb.position.set(p.x, bs * 1.6, p.z); chainGroup.add(lb);
    });
    // 이름표 (높이를 달리해 겹침 방지)
    var hs = real ? [3, 9, 15, 21, 12] : [1.0, 1.4, 1.9, 3.0, 4.6];
    STAGES.forEach(function (s, k) {
      var px = k === 0 ? (L.linac[0] + L.linac[1]) / 2 : L.cx[k];
      var pz = k === 0 ? 0 : (k === 4 ? -2 * s.Rd : -s.Rd);

      phPos[j * 3] += phVel[j * 3] * dt; phPos[j * 3 + 1] += phVel[j * 3 + 1] * dt; phPos[j * 3 + 2] += phVel[j * 3 + 2] * dt;
    }
    phGeo.attributes.position.needsUpdate = true;
    phMat.size = 0.1 + R * 0.012;
  }

  /* ---------- 모드 전환 ---------- */
  var mode = "chain";
  function setMode(v) {
    mode = v;
    var ch = v === "chain";
    chainGroup.visible = ch; beam.visible = ch; beam2.visible = ch; trail.line.visible = ch; trail2.line.visible = ch;
    desGroup.visible = !ch; desTrail.line.visible = !ch;
    gridReal.visible = ch && scaleSel.get() === "real";
    chainSec.hidden = !ch; desSec.hidden = ch;
    if (ch) { lastStageShown = -1; frameChainFollow(); buildChain(); }
    else {
      rebuildRing(); updateDesign(); frameDesign();
      document.getElementById("hud-scale").innerHTML = '<span class="k">화면 축척</span> 격자 1칸 = <b>1 km</b><span class="wide-only"> · 빔 회전·복사 광자는 매우 느리게 표현</span>';
    }
  }
  function frameChainFollow() { /* 따라가기 켜져 있으면 다음 프레임부터 카메라가 이동 */ }

  sim.onFrame(function (dt, t, real) {
    if (mode === "chain") { stepChain(dt); updateChainUI(); }
    else stepDesign(dt, real);
  });
  sim.controls.addEventListener("start", function () { if (mode === "chain") followTg.set(false); });

  buildStageTable();
  buildChain();
  restartBeam(false);
  setMode("chain");
  sim.setView([layout.cx[1] - 2, 3, 5], [layout.cx[1] - 2, 0, -1]);
  window.addEventListener("resize", function () { if (mode === "design") drawDesignPlot(); });
})();
</script>
</body>
</html>
