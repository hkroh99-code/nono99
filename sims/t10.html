<title>CMS 오픈데이터 분석실 모의실험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="../assets/css/sim.css">
<style>
  /* 이 모의실험에만 쓰는 보조 스타일 */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem .6rem; }
  .grid2 .ctl { min-width: 0; }
  .seg { display: flex; border: 1px solid var(--s-line); border-radius: 7px; overflow: hidden; }
  .seg button { flex: 1; font: inherit; font-size: .8rem; padding: .4rem .35rem; background: var(--s-panel-2); color: var(--s-ink-2); border: 0; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--s-line); }
  .seg button[aria-pressed="true"] { background: var(--s-accent); color: #0a0f1e; font-weight: 700; }
  #hist { touch-action: pan-y; cursor: crosshair; }
  .evt th, .evt td { font-size: .74rem; padding: .25rem .35rem; }
  .evt td.der { color: var(--s-ink-3); font-style: italic; }
  .evt tr.sum td { color: var(--s-track); border-top: 1px solid var(--s-ink-3); }
  .msg { font-size: .84rem; color: var(--s-ink-2); min-height: 1.2em; }
  .msg b { color: var(--s-ink); }
  .formula-s { font-family: var(--font-mono); font-size: .8rem; background: var(--s-panel-2); border-radius: 6px; padding: .4rem .55rem; color: var(--s-ink); overflow-x: auto; white-space: nowrap; }
  .fileline { display: grid; gap: .3rem; font-size: .85rem; }
  .fileline input[type="file"] { font: inherit; font-size: .8rem; color: var(--s-ink-2); max-width: 100%; }
  .status { font-size: .82rem; color: var(--s-ok); }
  .status.bad { color: var(--s-bad); }
  .stage-controls { flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 24px); }
  .stage-controls .sbtn { background: rgba(15, 21, 38, .88); padding: .4rem .7rem; }
  .hud i.sw { display: inline-block; width: .8rem; height: .25rem; border-radius: 2px; vertical-align: middle; margin: 0 .25rem 0 .1rem; }
  .row-inline { display: flex; gap: .4rem; align-items: center; }
  .row-inline input { flex: 1; min-width: 0; }
  @media (max-width: 860px) { .stage-hint { bottom: 54px; } }
  @media (max-width: 560px) { .stage-hint { display: none; } .hud { font-size: .74rem; padding: .35rem .5rem; } }
</style>
</head>
<body>
<div class="sim">
  <header class="sim-head">
    <span class="tag">주제 10 · 3D</span>
    <h1>CMS 오픈데이터 분석실</h1>
    <nav aria-label="관련 자료">
      <a href="../students/t10.html">학생용 활동지</a>
      <a href="../teachers/t10.html">교사용 지도서</a>
      <a href="../data/index.html">실제 데이터</a>
      <a href="index.html">모의실험 목록</a>
    </nav>
  </header>
  <div class="sim-body">
    <div class="stage" id="stage">
      <div class="stage-overlay" id="overlay">
        <div class="hud" id="hud-ev"><span class="k">데이터를 불러오는 중…</span></div>
        <div class="hud" id="hud-leg">
          <i class="sw" style="background:#ff5d8f"></i>뮤온 <i class="sw" style="background:#3fb6ff"></i>전자
          <span class="k">· 실제 크기(1 m = 1 m), 바닥 격자 1칸 = 1 m · 솔레노이드 안 B = 3.8 T</span>
        </div>
      </div>
      <div class="stage-hint">드래그: 회전 · 휠/두 손가락: 확대 · 오른쪽 드래그: 이동</div>
      <div class="stage-controls">
        <button class="sbtn" type="button" id="st-prev">이전</button>
        <button class="sbtn" type="button" id="st-next">다음</button>
        <button class="sbtn" type="button" id="st-rand">무작위</button>
        <button class="sbtn" type="button" id="st-rot" aria-pressed="true">회전 멈춤</button>
      </div>
    </div>
    <aside class="panel" id="panel" aria-label="조작과 기록"></aside>
  </div>
</div>
<script src="../assets/vendor/three/three.min.js"></script>
<script src="../assets/vendor/three/OrbitControls.js"></script>
<script src="../assets/js/sim-kit.js"></script>
<script>
(function () {
  "use strict";
  var THREE = window.THREE, K = window.SimKit, ui = K.ui, fmt = K.fmt;
  var sim = K.create({ stage: document.getElementById("stage"), cameraPos: [17, 8.5, 17], target: [0, 0, 0], grid: false, far: 600 });
  var panel = document.getElementById("panel");
  sim.controls.autoRotate = true;
  sim.controls.autoRotateSpeed = 0.7;

  /* ================= 기준 질량 (GeV/c²) ================= */
  var REFS = [
    { key: "omega", name: "ω(782)", short: "ω", m: 0.783 },
    { key: "phi", name: "φ(1020)", short: "φ", m: 1.019 },
    { key: "jpsi", name: "J/ψ", short: "J/ψ", m: 3.097 },
    { key: "psi2s", name: "ψ(2S)", short: "ψ(2S)", m: 3.686 },
    { key: "y1s", name: "Υ(1S)", short: "Υ(1S)", m: 9.460 },
    { key: "y2s", name: "Υ(2S)", short: "Υ(2S)", m: 10.023 },
    { key: "y3s", name: "Υ(3S)", short: "Υ(3S)", m: 10.355 },
    { key: "z", name: "Z", short: "Z", m: 91.19 },
    { key: "h", name: "힉스 H", short: "H", m: 125.1 }
  ];
  function nearestRef(m, tol) {
    var best = null, bd = Infinity;
    REFS.forEach(function (r) { var d = Math.abs(m - r.m) / r.m; if (d < bd) { bd = d; best = r; } });
    return bd <= (tol || 0.05) ? best : null;
  }

  /* ================= 가우스 + 1차 배경 맞춤 =================
     model(x) = A·exp(−(x−μ)²/(2σ²)) + b0 + b1·(x − xm)
     가중 최소제곱(가중치 1/max(n,1)), Levenberg–Marquardt 반복. 초기값은 가장자리 배경 + 반치폭으로 추정하고
     σ 초기값을 세 가지(×1, ×0.5, ×2)로 시도해 가장 작은 χ²를 고른다. */
  function solveLinear(M, v) {
    var n = v.length, a = M.map(function (r, i) { return r.slice().concat([v[i]]); });
    for (var c = 0; c < n; c++) {
      var piv = c;
      for (var r = c + 1; r < n; r++) if (Math.abs(a[r][c]) > Math.abs(a[piv][c])) piv = r;
      if (Math.abs(a[piv][c]) < 1e-300) return null;
      var tmp = a[c]; a[c] = a[piv]; a[piv] = tmp;
      for (var r2 = 0; r2 < n; r2++) {
        if (r2 === c) continue;
        var f = a[r2][c] / a[c][c];
        for (var k = c; k <= n; k++) a[r2][k] -= f * a[c][k];
      }
    }
    return a.map(function (r, i) { return r[n] / r[i]; });
  }
  function invert(M) {
    var n = M.length, cols = [];
    for (var i = 0; i < n; i++) { var e = new Array(n).fill(0); e[i] = 1; var c = solveLinear(M, e); if (!c) return null; cols.push(c); }
    return M.map(function (_, i) { return cols.map(function (c) { return c[i]; }); });
  }
  function gaussFit(xs, ys, binW) {
    var n = xs.length;
    if (n < 8) return { ok: false, msg: "구간 안의 막대가 너무 적습니다(8개 이상 필요). 구간을 넓히거나 막대 수를 늘리세요." };
    var lo = xs[0] - binW / 2, hi = xs[n - 1] + binW / 2, xm = (lo + hi) / 2;
    var tot = 0; ys.forEach(function (y) { tot += y; });
    if (tot < 20) return { ok: false, msg: "구간 안의 사건이 20건 미만이라 맞춤이 의미 없습니다. [구간 통계]로 사건 수를 세어 보세요." };
    var wt = ys.map(function (y) { return 1 / Math.max(y, 1); });
    var ne = Math.max(2, Math.round(n * 0.18)), xl = 0, yl = 0, xr = 0, yr = 0;
    for (var i = 0; i < ne; i++) { xl += xs[i]; yl += ys[i]; xr += xs[n - 1 - i]; yr += ys[n - 1 - i]; }
    xl /= ne; yl /= ne; xr /= ne; yr /= ne;
    var b1 = (yr - yl) / (xr - xl), b0 = yl + b1 * (xm - xl);
    var sm = ys.map(function (y, i) {
      var a = 0, c = 0; for (var k = Math.max(0, i - 1); k <= Math.min(n - 1, i + 1); k++) { a += ys[k]; c++; }
      return a / c - (b0 + b1 * (xs[i] - xm));
    });
    var im = 0; for (var j = 1; j < n; j++) if (sm[j] > sm[im]) im = j;
    var A0 = Math.max(sm[im], 1), mu0 = xs[im], l = im, r = im;
    while (l > 0 && sm[l] > A0 / 2) l--;
    while (r < n - 1 && sm[r] > A0 / 2) r++;
    var sg0 = Math.min(Math.max((xs[r] - xs[l]) / 2.355, binW * 0.7), (hi - lo) / 4);
    function model(p, x) { var z = (x - p[1]) / p[2]; return p[0] * Math.exp(-0.5 * z * z) + p[3] + p[4] * (x - xm); }
    function chi2(p) { var s = 0; for (var i = 0; i < n; i++) { var d = ys[i] - model(p, xs[i]); s += wt[i] * d * d; } return s; }
    function jac(p, x) { var z = (x - p[1]) / p[2], g = Math.exp(-0.5 * z * z); return [g, p[0] * g * z / p[2], p[0] * g * z * z / p[2], 1, x - xm]; }
    function lm(p) {
      var lam = 1e-3, c = chi2(p);
      for (var it = 0; it < 300; it++) {
        var JtJ = [], Jtr = [0, 0, 0, 0, 0];
        for (var a = 0; a < 5; a++) JtJ.push([0, 0, 0, 0, 0]);
        for (var i = 0; i < n; i++) {
          var J = jac(p, xs[i]), res = ys[i] - model(p, xs[i]);
          for (var a2 = 0; a2 < 5; a2++) { Jtr[a2] += wt[i] * J[a2] * res; for (var b = 0; b < 5; b++) JtJ[a2][b] += wt[i] * J[a2] * J[b]; }
        }
        var Mx = JtJ.map(function (row, k) { var rr = row.slice(); rr[k] *= (1 + lam); return rr; });
        var dp = solveLinear(Mx, Jtr);
        if (!dp) { lam *= 10; if (lam > 1e10) break; continue; }
        var q = p.map(function (v, k) { return v + dp[k]; });
        q[2] = Math.abs(q[2]);
        var bad = q[2] < binW * 0.05 || q[1] < lo || q[1] > hi || !isFinite(q[0]);
        var cq = bad ? Infinity : chi2(q);
        if (cq < c) {
          var conv = (c - cq) < 1e-7 * Math.max(1, c);
          p = q; c = cq; lam = Math.max(lam / 10, 1e-9);
          if (conv) break;
        } else { lam *= 10; if (lam > 1e10) break; }
      }
      return { p: p, c: c };
    }
    var best = null;
    [1, 0.5, 2].forEach(function (f) {
      var res = lm([A0, mu0, sg0 * f, b0, b1]);
      if (res.p[0] > 0 && (!best || res.c < best.c)) best = res;
    });
    if (!best) return { ok: false, msg: "봉우리를 찾지 못했습니다. 봉우리가 구간 가운데 오도록 구간을 다시 잡아 보세요." };
    var p = best.p, Hm = [];
    for (var a3 = 0; a3 < 5; a3++) Hm.push([0, 0, 0, 0, 0]);
    for (var i3 = 0; i3 < n; i3++) { var J3 = jac(p, xs[i3]); for (var u = 0; u < 5; u++) for (var v = 0; v < 5; v++) Hm[u][v] += wt[i3] * J3[u] * J3[v]; }
    var cov = invert(Hm);
    var err = function (k) { return cov && cov[k][k] > 0 ? Math.sqrt(cov[k][k]) : NaN; };
    var k2 = Math.sqrt(2 * Math.PI) / binW, nsig = p[0] * p[2] * k2;
    var a2s = Math.max(lo, p[1] - 2 * p[2]), b2s = Math.min(hi, p[1] + 2 * p[2]);
    var bgIn = ((p[3] + p[4] * ((a2s + b2s) / 2 - xm)) * (b2s - a2s)) / binW;
    var ok = p[2] < (hi - lo) * 0.6 && nsig > 0;
    return {
      ok: ok, msg: ok ? "" : "맞춤 결과가 불안정합니다(봉우리 폭이 구간만큼 넓음). 구간을 봉우리 주변으로 좁혀 보세요.",
      mu: p[1], sigma: p[2], muErr: err(1), sigmaErr: err(2), nsig: nsig, lo: lo, hi: hi,
      bgIn: Math.max(0, bgIn), sigIn: nsig * 0.9545, chi2: best.c, ndf: n - 5,
      f: function (x) { return model(p, x); }, bg: function (x) { return p[3] + p[4] * (x - xm); }
    };
  }

  /* ================= 렙톤·사건 만들기 ================= */
  var MMU = 0.10566, ME = 0.000511;
  function num(v) { var x = typeof v === "number" ? v : parseFloat(v); return isFinite(x) ? x : 0; }
  function lepName(l) { var s = l.q > 0 ? "⁺" : (l.q < 0 ? "⁻" : ""); return (l.type === "e" ? "e" : "μ") + s; }
  function lepFrom4(E, px, py, pz, q, pid) {
    E = num(E); px = num(px); py = num(py); pz = num(pz);
    var pt = Math.sqrt(px * px + py * py);
    var pidN = pid === undefined || pid === "" ? null : num(pid);
    return { E: E, px: px, py: py, pz: pz, q: num(q), pid: pidN, type: pidN !== null && Math.abs(pidN) === 11 ? "e" : "mu",
      pt: pt, eta: pt > 0 ? Math.asinh(pz / pt) : 0, phi: Math.atan2(py, px), src: "4v" };
  }
  function lepFromPEP(pt, eta, phi, q, type) {
    pt = num(pt); eta = num(eta); phi = num(phi);
    var px = pt * Math.cos(phi), py = pt * Math.sin(phi), pz = pt * Math.sinh(eta), m = type === "e" ? ME : MMU;
    return { E: Math.sqrt(px * px + py * py + pz * pz + m * m), px: px, py: py, pz: pz, q: num(q), pid: null, type: type || "mu",
      pt: pt, eta: eta, phi: phi, src: "pep" };
  }
  function massPEP(a, b) { var v = 2 * a.pt * b.pt * (Math.cosh(a.eta - b.eta) - Math.cos(a.phi - b.phi)); return v > 0 ? Math.sqrt(v) : 0; }
  function evMass(ev) { return ev.src === "pep" ? massPEP(ev.leps[0], ev.leps[1]) : K.invariantMass(ev.leps); }
  function finish(ev) { ev.M = evMass(ev); ev.os = ev.leps.length !== 2 || ev.leps[0].q * ev.leps[1].q < 0; return ev; }

  /* 열 이름 찾기(대소문자·공백·BOM 무시) */
  function keyMap(row) {
    var map = {};
    Object.keys(row).forEach(function (k) { map[k.replace(/^﻿/, "").trim().toLowerCase()] = k; });
    return map;
  }
  function detect(map) {
    var nl = 0;
    for (var i = 1; i <= 4; i++) if (map["e" + i] && map["px" + i] && map["py" + i] && map["pz" + i]) nl = i; else break;
    if (nl >= 2) return { kind: "4v", n: nl };
    if (map.pt1 && map.eta1 && map.phi1 && map.pt2 && map.eta2 && map.phi2) return { kind: "pep", n: 2 };
    var mk = ["m", "mass", "invariant_mass", "invmass", "m(gev)", "m [gev]"].filter(function (k) { return map[k]; })[0];
    if (mk) return { kind: "m", col: map[mk] };
    var keys = Object.keys(map);
    if (keys.length === 1) return { kind: "m", col: map[keys[0]] };
    return null;
  }
  function buildFromRows(rows, info) {
    var map = keyMap(rows[0]), g = function (r, k) { return map[k] !== undefined ? r[map[k]] : undefined; };
    var events = [], masses;
    if (info.kind === "4v") {
      rows.forEach(function (r) {
        var leps = [];
        for (var i = 1; i <= info.n; i++) leps.push(lepFrom4(g(r, "e" + i), g(r, "px" + i), g(r, "py" + i), g(r, "pz" + i), g(r, "q" + i), g(r, "pid" + i)));
        if (!isFinite(leps[0].E) || leps[0].E === 0) return;
        events.push(finish({ leps: leps, src: "4v", run: g(r, "run"), evn: g(r, "event"), Mfile: g(r, "m"),
          year: g(r, "year"), channel: g(r, "channel"), mZ1: g(r, "mz1"), mZ2: g(r, "mz2") }));
      });
    } else if (info.kind === "pep") {
      rows.forEach(function (r) {
        var t1 = String(g(r, "type1") || "").match(/^E[BE]$/) ? "e" : "mu", t2 = String(g(r, "type2") || "").match(/^E[BE]$/) ? "e" : "mu";
        var leps = [lepFromPEP(g(r, "pt1"), g(r, "eta1"), g(r, "phi1"), g(r, "q1"), t1), lepFromPEP(g(r, "pt2"), g(r, "eta2"), g(r, "phi2"), g(r, "q2"), t2)];
        if (!leps[0].pt) return;
        events.push(finish({ leps: leps, src: "pep", run: g(r, "run"), evn: g(r, "event"), Mfile: g(r, "m") }));
      });
    } else {
      masses = [];
      rows.forEach(function (r) { var v = parseFloat(r[info.col]); if (isFinite(v) && v > 0) masses.push(v); });
      return { kind: "m", masses: Float64Array.from(masses), events: null };
    }
    return { kind: info.kind, events: events, masses: Float64Array.from(events.map(function (e) { return e.M; })) };
  }

  /* ================= 데이터셋 ================= */
  var DATASETS = {
    mass: { file: "cms_dimuon_2011_mass", label: "이중뮤온 100,000건 (질량 M)", short: "이중뮤온 질량",
      note: "CMS 2011년 DoubleMu 데이터에서 고른 반대 부호 뮤온 쌍 100,000개의 불변질량. 0.3~300 GeV에 걸친 전체 스펙트럼. 3D 사건 보기는 4-벡터가 있는 처음 20,000건(같은 순서)을 보여 줍니다." },
    events: { file: "cms_dimuon_2011_events", label: "이중뮤온 사건 20,000건 (4-벡터)", short: "이중뮤온 4-벡터",
      note: "같은 데이터의 처음 20,000건. 뮤온 두 개의 E, px, py, pz(GeV)와 전하. 히스토그램은 4-벡터로 다시 계산한 M입니다." },
    zmumu: { file: "cms_zmumu_2011", label: "Z→μμ 10,583건 (pt, η, φ)", short: "Z→μμ",
      note: "CMS 2011년 Z 보손 후보(두 뮤온 pT > 20 GeV, |η| < 2.1, 60~120 GeV). pt, η, φ만 있으므로 M² = 2·pT1·pT2·(cosh Δη − cos Δφ)로 계산합니다." },
    h4l: { file: "cms_higgs4l_2011_2012", label: "4렙톤 278건 (힉스 탐색)", short: "4렙톤",
      note: "CMS 2011~2012년 힉스→ZZ→4렙톤 분석 예제를 통과한 사건(4μ, 4e, 2e2μ). 렙톤 4개의 4-벡터로 M을 계산합니다." }
  };
  var loaded = {}, cur = null, curKey = null;
  function convert(key, rows) {
    if (key === "mass") { var m = new Float64Array(rows.length); rows.forEach(function (r, i) { m[i] = num(r.M); }); return { kind: "m", masses: m, events: null }; }
    var info = key === "zmumu" ? { kind: "pep", n: 2 } : { kind: "4v", n: key === "h4l" ? 4 : 2 };
    return buildFromRows(rows, info);
  }
  function load(key) {
    if (loaded[key]) return Promise.resolve(loaded[key]);
    return K.data.load(DATASETS[key].file, "../").then(function (rows) {
      var o = convert(key, rows); o.key = key; o.label = DATASETS[key].label; o.short = DATASETS[key].short; o.note = DATASETS[key].note;
      o.all = o.masses; loaded[key] = o; return o;
    });
  }

  /* ================= 패널: 미션 ================= */

    var dsName = cur.key === "mass" ? DATASETS.events.short : cur.short;
    hud.innerHTML = '<span class="k">' + dsName + " · 사건 </span><span class=\"v\">" + (idx + 1).toLocaleString("ko-KR") + "</span><span class=\"k\"> / " + all.length.toLocaleString("ko-KR") + "</span>" +
      (ev.run !== undefined ? '<span class="k"> · Run </span><span class="v">' + ev.run + '</span><span class="k"> Event </span><span class="v">' + ev.evn + "</span>" : "") +
      (ev.year ? '<span class="k"> · ' + ev.year + " · " + ev.channel + "</span>" : "") +
      '<br><span class="k">렙톤 ' + ev.leps.length + "개 · 불변질량 </span><span class=\"v\">" + (show ? "M = " + ev.M.toFixed(3) + " GeV" : "M = ? (직접 계산해 보세요)") + "</span>" +
      (show && ev.mZ1 !== undefined ? '<span class="k"> · m(Z1) = ' + ev.mZ1 + ", m(Z2) = " + ev.mZ2 + " GeV</span>" : "");
    document.getElementById("ev-count").textContent = "목록 " + (nav.pos + 1).toLocaleString("ko-KR") + " / " + nav.list.length.toLocaleString("ko-KR");
    inGo.value = idx + 1;
    var pep = ev.src === "pep";
    var h = '<table class="rec evt"><tr><th>입자</th><th>E</th><th>px</th><th>py</th><th>pz</th><th>pT</th><th>η</th><th>φ</th></tr>';
    var sE = 0, sx = 0, sy = 0, sz = 0;
    ev.leps.forEach(function (l) {
      sE += l.E; sx += l.px; sy += l.py; sz += l.pz;
      var d4 = pep ? ' class="der"' : "", dp = pep ? "" : ' class="der"';
      var raw = function (v) { return pep ? f4(v, 3) : String(v); };
      h += "<tr><td>" + lepName(l) + "</td><td" + d4 + ">" + raw(l.E) + "</td><td" + d4 + ">" + raw(l.px) + "</td><td" + d4 + ">" + raw(l.py) + "</td><td" + d4 + ">" + raw(l.pz) +
        "</td><td" + dp + ">" + (pep ? String(l.pt) : f4(l.pt, 3)) + "</td><td" + dp + ">" + (pep ? String(l.eta) : f4(l.eta, 3)) + "</td><td" + dp + ">" + (pep ? String(l.phi) : f4(l.phi, 3)) + "</td></tr>";
    });
    if (show) h += '<tr class="sum"><td>합 Σ</td><td>' + f4(sE, 3) + "</td><td>" + f4(sx, 3) + "</td><td>" + f4(sy, 3) + "</td><td>" + f4(sz, 3) + '</td><td colspan="3">M = ' + ev.M.toFixed(3) + "</td></tr>";
    evTable.innerHTML = h + "</table>";
    evNote.innerHTML = pep
      ? "에너지·운동량 단위 GeV(GeV/c), 각도 φ는 라디안. 이 데이터에는 pT, η, φ만 기록되어 있습니다. 기울임 글씨(E, px, py, pz)는 그 값으로 계산한 것입니다."
      : "에너지·운동량 단위 GeV(GeV/c), φ는 라디안. 기울임 글씨(pT, η, φ)는 4-벡터로 계산한 값입니다." + (ev.Mfile !== undefined && show ? " 파일에 적힌 M: " + ev.Mfile + " GeV." : "");
    calcF.textContent = pep ? "M = √[2·pT₁·pT₂·(cosh(η₁−η₂) − cos(φ₁−φ₂))]" :
      (ev.leps.length === 4 ? "M = √[(ΣE)² − (Σpx)² − (Σpy)² − (Σpz)²]  (렙톤 4개 합)" : "M = √[(E₁+E₂)² − (px₁+px₂)² − (py₁+py₂)² − (pz₁+pz₂)²]");
  }
  function checkCalc() {
    var ev = curEvent(); if (!ev) return;
    var v = parseFloat(calcIn.value);
    if (!isFinite(v)) { calcMsg.textContent = "계산한 값을 숫자로 입력하세요(단위 GeV)."; return; }
    var key = evKey(), d = Math.abs(v - ev.M), ok = d <= Math.max(0.01 * ev.M, 0.005);
    if (ok) {
      revealed[key] = true; showCurrent();
      calcIn.value = v;
      calcMsg.innerHTML = '<span class="result-ok">정답!</span> 4-벡터로 계산한 M = <b>' + ev.M.toFixed(3) + " GeV</b>, 내 값과 차이 " + fmt(100 * d / ev.M, 2) + "%." +
        (nearestRef(ev.M, 0.04) ? " 이 질량은 " + nearestRef(ev.M, 0.04).name + "(" + nearestRef(ev.M, 0.04).m + " GeV)에 가깝습니다." : "");
      mission.complete(4, "미션 5 완료! 불변질량을 손으로 계산해 맞혔습니다.");
    } else {
      tries[key] = (tries[key] || 0) + 1;
      calcMsg.innerHTML = '<span class="result-bad">아직 달라요.</span> (차이 ' + fmt(100 * d / ev.M, 2) + "%) " +
        (ev.src === "pep" ? "cosh와 cos 안에는 차이(η₁−η₂, φ₁−φ₂)를 넣고, φ는 라디안 모드로 계산하세요." :
          "먼저 ΣE, Σpx, Σpy, Σpz를 각각 더한 뒤 제곱하세요. 각 입자의 질량을 따로 구해 더하면 안 됩니다.") +
        (tries[key] >= 2 ? " 힌트: ΣE = " + f4(ev.leps.reduce(function (s, l) { return s + l.E; }, 0), 3) + " GeV" : "");
    }
  }

  /* ================= 데이터셋 바꾸기 ================= */
  function applyFilter() {
    if (!cur) return;
    var hasQ = !!(cur.events && cur.events.length && cur.events[0].leps.length === 2 && cur.events.some(function (e) { return !e.os; }));
    tgOS.el.parentNode.hidden = !hasQ;
    if (hasQ && tgOS.get()) cur.masses = Float64Array.from(cur.events.filter(function (e) { return e.os; }).map(function (e) { return e.M; }));
    else cur.masses = cur.all;
  }
  function setStatus(t, bad) { dsStatus.textContent = t; dsStatus.className = "status" + (bad ? " bad" : ""); }
  function activate(o, presetName) {
    cur = o; curKey = o.key; clearFit(); H.last = null; H.zReady = false;
    applyFilter();
    dsNote.textContent = o.note || "";
    setStatus(o.label + " · 히스토그램 " + o.masses.length.toLocaleString("ko-KR") + "건 준비됨");
    ["n", "mean", "sd"].forEach(function (k) { ro.set(k, "–"); });
    applyPreset(presetName);
    rebuildList(); showCurrent();
  }
  function setDataset(key) {
    if (key === "user") { if (loaded.user) activate(loaded.user, "full"); return; }
    setStatus("불러오는 중… (" + DATASETS[key].label + ")");
    var need = [load(key)]; if (key === "mass") need.push(load("events"));
    Promise.all(need).then(function () {
      if (dsSel.get() !== key) return;
      activate(loaded[key], { mass: "full", events: "full", zmumu: "z", h4l: "h" }[key]);
    }).catch(function (err) { setStatus("데이터를 불러오지 못했습니다: " + err.message + " (data/js 폴더가 함께 있어야 합니다)", true); });
  }

  /* ---------- 내 CSV ---------- */
  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0]; if (!file) return;
    setStatus("읽는 중… " + file.name);
    var fr = new FileReader();
    fr.onerror = function () { setStatus("파일을 읽지 못했습니다.", true); };
    fr.onload = function () {
      try {
        var text = String(fr.result).replace(/^﻿/, "");
        var first = text.slice(0, text.indexOf("\n") >= 0 ? text.indexOf("\n") : text.length);
        if (first.indexOf(",") < 0) { if (first.indexOf(";") >= 0) text = text.replace(/;/g, ","); else if (first.indexOf("\t") >= 0) text = text.replace(/\t/g, ","); }
        var rows = K.data.parseCSV(text);
        if (!rows.length) throw new Error("데이터 줄이 없습니다.");
        var info = detect(keyMap(rows[0]));
        if (!info) throw new Error("열 이름을 알아보지 못했습니다. 첫 줄: " + first.slice(0, 80));
        var o = buildFromRows(rows, info);
        if (!o.masses.length) throw new Error("계산할 수 있는 사건이 없습니다.");
        o.key = "user"; o.short = "내 CSV"; o.all = o.masses;
        o.label = "내 CSV: " + file.name + " (" + o.masses.length.toLocaleString("ko-KR") + "건)";
        o.note = { "4v": "렙톤 " + info.n + "개의 E, px, py, pz로 불변질량을 계산했습니다.", pep: "pt, η, φ로 불변질량을 계산했습니다(질량 없는 근사).", m: "M 열의 값을 그대로 사용합니다. 4-벡터가 없어 3D 사건 보기는 할 수 없습니다." }[info.kind];
        loaded.user = o;
        var opt = dsSel.el.querySelector('option[value="user"]');
        if (!opt) { opt = document.createElement("option"); opt.value = "user"; dsSel.el.appendChild(opt); }
        opt.textContent = o.label; dsSel.set("user");
        activate(o, "full");
        K.toast("내 CSV를 불러왔어요: " + o.masses.length.toLocaleString("ko-KR") + "건");
      } catch (err) { setStatus("CSV 오류: " + err.message, true); }
    };
    fr.readAsText(file);
  });

  /* ---------- 시작: 이중뮤온 질량 + 첫 사건 ---------- */
  syncInputs(); draw();
  setDataset("mass");

  // 테스트·수업용 훅(콘솔에서 확인 가능)
  window.T10 = { H: H, fit: gaussFit, state: function () { return { key: cur && cur.key, n: cur && cur.masses.length, fit: H.fit, last: H.last, list: nav.list && nav.list.length, ev: curEvent() }; }, applyPreset: applyPreset, doFit: doFit, windowStats: windowStats, recordNow: recordNow };
})();
</script>
</body>
</html>
