<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMS 검출기 탐험 모의실험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../assets/css/sim.css">
<style>
  /* 이 모의실험에서만 쓰는 보조 스타일 (sim.css 색 변수 사용) */
  .fp { border-collapse: collapse; width: 100%; font-size: .78rem; }
  .fp th, .fp td { border-bottom: 1px solid var(--s-line); padding: .28rem .3rem; text-align: center; white-space: nowrap; }
  .fp th { background: var(--s-panel-2); color: var(--s-ink-2); font-weight: 700; }
  .fp td:first-child, .fp th:first-child { text-align: left; }
  .fp td { color: var(--s-ink-3); font-family: var(--font-mono); }
  .fp td:first-child { font-family: var(--font-body); color: var(--s-ink-2); }
  .fp td.on { color: var(--s-ok); font-weight: 700; }
  .fp td.weak { color: var(--s-warn); }
  .fp-wrap { overflow-x: auto; border: 1px solid var(--s-line); border-radius: 7px; }
  .info-card { background: var(--s-panel-2); border-radius: 7px; padding: .55rem .7rem; font-size: .84rem; color: var(--s-ink-2); line-height: 1.55; }
  .info-card b { color: var(--s-ink); }
  .quiz-status { font-size: .86rem; color: var(--s-ink-2); }
  .quiz-log { list-style: none; margin: 0; padding: 0; display: grid; gap: .2rem; font-size: .8rem; color: var(--s-ink-2); }
  .hud b { color: var(--s-ink); font-weight: 600; }
  .hud .msg { display: block; color: var(--s-ink-2); margin-top: .15rem; }
  #hud-main { min-width: 13rem; }
  @media (max-width: 860px) { .hud { font-size: .74rem; padding: .35rem .55rem; } #hud-main { min-width: 0; } }
</style>
</head>
<body>
<div class="sim">
  <header class="sim-head">
    <span class="tag">주제 05 · 3D</span>
    <h1>CMS 검출기 탐험</h1>
    <nav aria-label="관련 자료">
      <a href="../students/t05.html">학생용 활동지</a>
      <a href="../teachers/t05.html">교사용 지도서</a>
      <a href="index.html">모의실험 목록</a>
    </nav>
  </header>
  <div class="sim-body">
    <div class="stage" id="stage">
      <div class="stage-overlay" id="overlay">
        <div class="hud" id="hud-main"><span class="k">입자</span> <b id="h-name">–</b> <span class="k">· p</span> <span class="v" id="h-p">–</span><span class="msg" id="h-msg">충돌점에서 입자를 발사합니다.</span></div>
        <div class="hud"><span class="k">자기장</span> <span class="v">3.8 T</span> <span class="k">(솔레노이드 안, +z)</span> · <span class="v">약 −2 T</span> <span class="k">(철 요크)</span><span class="msg">정면(+z)에서 보면 양전하는 시계 방향으로 휨</span><span class="msg">화면 축척: 1칸 = 1 m · 실제보다 약 4천만 배 느리게</span></div>
      </div>
      <div class="stage-hint">드래그: 회전 · 휠/두 손가락: 확대 · 오른쪽 드래그: 이동</div>
    </div>
    <aside class="panel" id="panel" aria-label="조작과 기록"></aside>
  </div>
</div>
<script src="../assets/vendor/three/three.min.js"></script>
<script src="../assets/vendor/three/OrbitControls.js"></script>
<script src="../assets/js/sim-kit.js"></script>
<script>
(function () {
  "use strict";
  var THREE = window.THREE, K = window.SimKit, ui = K.ui, COL = K.COLORS;
  var sim = K.create({ stage: document.getElementById("stage"), cameraPos: [8.5, 6.5, 17], target: [0, -0.3, -1.5], grid: { size: 24, divisions: 24, y: -7.9 } });
  var scene = sim.scene;
  var panel = document.getElementById("panel");

  /* ================= 상수 ================= */
  var B_IN = 3.8, B_YOKE = -1.8;       // T (솔레노이드 안 / 철 요크 안: 방향 반대)
  var DS = 0.02;                       // 궤적 적분 간격 (m)
  var BASE_SPEED = 8;                  // 화면 속 입자 속력 (m/s) → 실제보다 약 3.7×10⁷배 느림
  var CUT_FROM = 0, CUT_TO = Math.PI / 2; // 절개 보기에서 잘라 내는 방위각 범위
  var TRK_R = [0.044, 0.073, 0.102, 0.16, 0.25, 0.34, 0.43, 0.52, 0.61, 0.70, 0.80, 0.90, 1.0, 1.08];
  var CH_R = [[4.0, 4.2], [4.85, 5.05], [5.95, 6.15], [7.0, 7.2]];
  var IRON_R = [[4.3, 4.75], [5.2, 5.85], [6.3, 6.95]];
  var R_ECAL = [1.29, 1.52], R_HCAL = [1.77, 2.95];

  var LAYERS = [
    { key: "tracker", short: "트래커", name: "실리콘 트래커", tubes: [[0.03, 1.1]], half: 2.9, color: 0x9fb6e8, op: 0.06,
      info: "<b>실리콘 트래커</b> (반지름 약 3 cm ~ 1.1 m)<br>얇은 규소 픽셀·띠 센서 층. 하전 입자가 지나간 점(히트)을 이어 궤적을 그린다. 휘는 방향 → 전하 부호, 휘는 정도(반지름 r) → 운동량 p = 0.3·B·r. 전기적으로 중성인 입자는 흔적을 남기지 않는다." },
    { key: "ecal", short: "ECAL", name: "전자기 칼로리미터", tubes: [R_ECAL], half: 3.0, color: 0x2fbf71, op: 0.2,
      info: "<b>전자기 칼로리미터(ECAL)</b> (반지름 약 1.3 m ~)<br>텅스텐산납(PbWO₄) 투명 결정 약 7만 6천 개. 전자·광자는 여기서 전자기 소나기를 일으켜 에너지를 거의 다 내놓는다. 결정이 내는 빛의 양으로 에너지를 잰다." },
    { key: "hcal", short: "HCAL", name: "강입자 칼로리미터", tubes: [R_HCAL], half: 4.3, color: 0x8a6fd6, op: 0.13,
      info: "<b>강입자 칼로리미터(HCAL)</b> (반지름 약 1.8 ~ 2.9 m)<br>황동 판과 플라스틱 섬광체를 번갈아 쌓은 층. 양성자·파이온·중성자 같은 강입자가 원자핵과 부딪쳐 강입자 소나기를 만들고 에너지를 내놓는다." },
    { key: "solenoid", short: "솔레노이드", name: "초전도 솔레노이드", tubes: [[2.97, 3.78]], half: 6.3, color: 0x9aa3bd, op: 0.09,
      info: "<b>초전도 솔레노이드</b> (지름 약 6 m, 길이 약 12.5 m)<br>초전도 코일에 큰 전류가 흘러 안쪽에 빔 방향으로 3.8 T의 균일한 자기장을 만든다. 트래커·ECAL·HCAL이 모두 이 코일 안에 들어 있다." },
    { key: "yoke", short: "요크·뮤온", name: "철 귀환 요크 + 뮤온 챔버", tubes: IRON_R, half: 6.6, color: 0xb03a52, op: 0.1, chambers: CH_R,
      info: "<b>철 귀환 요크 + 뮤온 챔버</b> (반지름 약 4 ~ 7.4 m)<br>철(약 1만 t)이 자기력선이 되돌아오는 길이 되어, 여기서는 자기장이 <b>반대 방향</b>(약 2 T)이다. 철판 사이의 뮤온 챔버(흰 층)는 이곳까지 뚫고 나오는 입자, 즉 거의 뮤온만 기록한다." }
  ];
  var LAYER_BY = {}; LAYERS.forEach(function (L) { LAYER_BY[L.key] = L; L.visible = true; });

  var PT = {
    em:  { label: "전자 e⁻", q: -1, m: 0.000511, color: COL.electron, kind: "em", cat: "e" },
    ep:  { label: "양전자 e⁺", q: 1, m: 0.000511, color: COL.positron, kind: "em", cat: "e" },
    mum: { label: "뮤온 μ⁻", q: -1, m: 0.10566, color: COL.muon, kind: "mu", cat: "mu" },
    mup: { label: "반뮤온 μ⁺", q: 1, m: 0.10566, color: COL.muon, kind: "mu", cat: "mu" },
    pip: { label: "파이온 π⁺", q: 1, m: 0.13957, color: COL.hadron, kind: "had", cat: "ch" },
    pim: { label: "파이온 π⁻", q: -1, m: 0.13957, color: COL.hadron, kind: "had", cat: "ch" },
    p:   { label: "양성자 p", q: 1, m: 0.93827, color: COL.proton, kind: "had", cat: "ch" },
    g:   { label: "광자 γ", q: 0, m: 0, color: COL.photon, kind: "em", cat: "g" },
    n:   { label: "중성자 n", q: 0, m: 0.93957, color: COL.neutron, kind: "had", cat: "n" },
    nu:  { label: "중성미자 ν", q: 0, m: 0, color: COL.neutrino, kind: "nu", cat: "nu" }
  };
  var CATS = [
    { key: "e", label: "전자 (e⁻, e⁺)" }, { key: "g", label: "광자 γ" }, { key: "mu", label: "뮤온 (μ⁻, μ⁺)" },
    { key: "ch", label: "하전 강입자 (π±, p)" }, { key: "n", label: "중성 강입자 (n)" }, { key: "nu", label: "중성미자 ν" }
  ];

  /* ================= 검출기 만들기 ================= */
  var det = new THREE.Group(); scene.add(det);
  var cutMode = "z", selectedKey = null;   // "z": 앞쪽 절반(z>0) 잘라 냄, "quarter": 앞쪽 1/4, "none": 잘라 내지 않음
  var Z_CUT = -0.06;

  function zRange(L) { return [-L.half, cutMode === "z" ? Z_CUT : L.half]; }
  function tubeGeo(rin, rout, z0, z1) {
    var pts = [new THREE.Vector2(rin, z0), new THREE.Vector2(rout, z0), new THREE.Vector2(rout, z1), new THREE.Vector2(rin, z1), new THREE.Vector2(rin, z0)];
    // LatheGeometry의 각 φ는 회전(x축 +90°) 뒤 방위각 ψ = φ − 90° 에 해당
    if (cutMode === "quarter") return new THREE.LatheGeometry(pts, 54, CUT_TO + Math.PI / 2, 2 * Math.PI - (CUT_TO - CUT_FROM));
    return new THREE.LatheGeometry(pts, 72, 0, 2 * Math.PI);
  }
  function capGeo(psi, rin, rout, z0, z1) {
    var c = Math.cos(psi), s = Math.sin(psi), g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array([
      rin * c, rin * s, z0, rout * c, rout * s, z0, rout * c, rout * s, z1,
      rin * c, rin * s, z0, rout * c, rout * s, z1, rin * c, rin * s, z1]), 3));
    g.computeVertexNormals();
    return g;
  }
  function arcLine(r, z, color, opacity) {
    var q = cutMode === "quarter", a0 = q ? CUT_TO : 0, a1 = q ? CUT_FROM + 2 * Math.PI : 2 * Math.PI, n = 72, pts = [];
    for (var i = 0; i <= n; i++) { var a = a0 + (a1 - a0) * i / n; pts.push(new THREE.Vector3(r * Math.cos(a), r * Math.sin(a), z)); }
    return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: opacity }));
  }
  function disposeGroup(g) {
    g.traverse(function (o) {
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
  }
  function buildLayer(L, order) {
    if (L.group) { disposeGroup(L.group); det.remove(L.group); }
    var g = new THREE.Group(); L.group = g;
    var sel = selectedKey === L.key, mul = sel ? 3 : 1, zr = zRange(L);
    function addTube(rin, rout, color, op, lines) {
      var mat = new THREE.MeshLambertMaterial({ color: color, transparent: true, opacity: Math.min(0.75, op * mul), side: THREE.DoubleSide, depthWrite: false });
      var m = new THREE.Mesh(tubeGeo(rin, rout, zr[0], zr[1]), mat);
      m.rotation.x = Math.PI / 2; m.renderOrder = order; g.add(m);
      if (cutMode === "quarter") [CUT_TO, CUT_FROM].forEach(function (psi) { var cm = new THREE.Mesh(capGeo(psi, rin, rout, zr[0], zr[1]), mat); cm.renderOrder = order; g.add(cm); });
      if (lines !== false) zr.forEach(function (z) {
        g.add(arcLine(rin, z, color, sel ? 0.9 : 0.45));
        g.add(arcLine(rout, z, color, sel ? 0.9 : 0.45));
      });
    }
    L.tubes.forEach(function (t) { addTube(t[0], t[1], L.color, L.op, L.key !== "tracker"); });
    if (L.key === "tracker") TRK_R.forEach(function (r) { zr.forEach(function (z) { g.add(arcLine(r, z, L.color, sel ? 0.8 : 0.32)); }); });
    if (L.chambers) L.chambers.forEach(function (t) { addTube(t[0], t[1], 0xe9ecf5, 0.07); });
    g.visible = L.visible;
    det.add(g);
  }
  function buildAll() { LAYERS.forEach(function (L, i) { buildLayer(L, 5 - i); }); placeLabels(); }

  // 빔관과 충돌점
  var beam = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, -9), new THREE.Vector3(0, 0, 9)]), new THREE.LineBasicMaterial({ color: 0x7880a0 }));
  scene.add(beam);
  var beamLbl = K.label("빔 방향 (z)", { height: 0.42, color: "#a9b0c8" }); beamLbl.position.set(0, 0.45, 8.6); scene.add(beamLbl);
  var vtx = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }));
  scene.add(vtx);

  // 이름표: 한 방위각(ψ ≈ 206°)을 따라 반지름 순서대로
  var labelGroup = new THREE.Group(); scene.add(labelGroup);
  LAYERS.forEach(function (L) {
    var lb = K.label(L.short, { height: 0.42, color: "#" + new THREE.Color(L.color).offsetHSL(0, 0, 0.2).getHexString() });
    lb.userData.L = L; labelGroup.add(lb);
  });
  function placeLabels() {
    var psi = 4.45;
    labelGroup.children.forEach(function (lb) {
      var L = lb.userData.L, rr = L.key === "yoke" ? 6.6 : (L.tubes[0][0] + L.tubes[0][1]) / 2;
      if (L.key === "tracker") rr = 0.75;
      lb.position.set(rr * Math.cos(psi), rr * Math.sin(psi), zRange(L)[1] + 0.1);
      lb.visible = L.visible;
    });
  }
  buildAll();

  // 자기장 방향 화살표
  var fieldGroup = new THREE.Group(); fieldGroup.visible = false; scene.add(fieldGroup);
  [0.6, 2.2, 3.8, 5.4].forEach(function (a) {
    fieldGroup.add(K.arrow(new THREE.Vector3(2.3 * Math.cos(a), 2.3 * Math.sin(a), -1.6), new THREE.Vector3(0, 0, 1), 3.2, COL.field));
    fieldGroup.add(K.arrow(new THREE.Vector3(5.5 * Math.cos(a + 0.4), 5.5 * Math.sin(a + 0.4), 1.6), new THREE.Vector3(0, 0, -1), 3.2, 0xff8a8a));
  });
  var fLbl1 = K.label("B = 3.8 T (+z)", { height: 0.4, color: "#7f9cff" }); fLbl1.position.set(0, 2.3, 2.2); fieldGroup.add(fLbl1);
  var fLbl2 = K.label("요크 안 B ≈ 2 T (−z)", { height: 0.4, color: "#ff8a8a" }); fLbl2.position.set(0, 5.5, -2.2); fieldGroup.add(fLbl2);

  /* ================= 물리: 궤적과 에너지 침착 ================= */
  function Bz(r) {
    if (r < 2.97) return B_IN;
    for (var i = 0; i < IRON_R.length; i++) if (r >= IRON_R[i][0] && r < IRON_R[i][1]) return B_YOKE;
    return 0;
  }
  function crossed(r0, r1, R) { return (r0 < R && r1 >= R) || (r0 >= R && r1 < R); }
  function inIron(r) { for (var i = 0; i < IRON_R.length; i++) if (r >= IRON_R[i][0] && r < IRON_R[i][1]) return true; return false; }
  function changeMom(mom, dp) { var m = mom.length(), nm = Math.max(1e-4, m + dp); mom.multiplyScalar(nm / m); }
  function smearEcal(E) { var s = Math.sqrt(Math.pow(0.028 / Math.sqrt(E), 2) + Math.pow(0.12 / E, 2) + 0.003 * 0.003); return Math.max(0.01, E * (1 + K.gauss(0, s))); }
  function smearHcal(E) { var s = Math.sqrt(1 / E + 0.05 * 0.05); return Math.max(0.05, E * (1 + K.gauss(0, s))); }

  function simulate(type, p, thDeg, phDeg) {
    var d = PT[type], th = thDeg * Math.PI / 180, ph = phDeg * Math.PI / 180;
    var mom = new THREE.Vector3(Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th)).multiplyScalar(p);
    var pos = new THREE.Vector3(), pts = [pos.clone()], evs = [];
    var res = { pT: p * Math.sin(th), E: Math.sqrt(p * p + d.m * d.m), ecal: 0, hcal: 0, trk: 0, ch: 0, stop: "exit", looped: false };
    res.rTrue = d.q !== 0 ? res.pT / (0.3 * B_IN) : 0;
    res.rMeas = d.q !== 0 ? res.rTrue * (1 + K.gauss(0, 0.01)) : 0;
    var hadStopR = 2.0 + Math.random() * 0.75;
    var early = d.kind === "had" && Math.random() < 0.35;
    var inEcal = false, inHcal = false, hcalMipDone = false, path = 0, r0 = 0, ecalHad = 0;
    function Enow() { var m = mom.length(); return Math.sqrt(m * m + d.m * d.m); }
    while (path < 40) {
      var pm = mom.length();
      if (d.q !== 0) {
        var B = Bz(Math.hypot(pos.x, pos.y));
        if (B !== 0) {
          var w = -0.3 * d.q * B * DS / pm, cw = Math.cos(w), sw = Math.sin(w);
          var nx = mom.x * cw - mom.y * sw, ny = mom.x * sw + mom.y * cw; mom.x = nx; mom.y = ny;
        }
      }
      pos.addScaledVector(mom, DS / pm); path += DS;
      var r1 = Math.hypot(pos.x, pos.y), i = pts.length;
      pts.push(pos.clone());
      if (d.q !== 0 && r1 < 1.1) {
        changeMom(mom, -(d.kind === "em" ? 0.06 : 0.03) * DS);  // 트래커 물질에서 조금씩 에너지 손실
        if (Math.abs(pos.z) < 2.9) for (var k = 0; k < TRK_R.length; k++) if (crossed(r0, r1, TRK_R[k])) { evs.push({ i: i, t: "hit", p: pos.clone() }); res.trk++; }
        if (Math.abs(pos.z) > 2.9) { res.stop = "trkz"; break; }
      }
      if (!inEcal && r0 < R_ECAL[0] && r1 >= R_ECAL[0]) {
        inEcal = true;
        if (Math.abs(pos.z) > 3.0) { res.stop = "exit"; break; }
        if (d.kind === "em") { var e1 = smearEcal(Enow()); res.ecal = e1; evs.push({ i: i, t: "ecal", p: pos.clone(), e: e1, full: true }); res.stop = "ecal"; break; }
        if (d.kind === "mu") { var e2 = 0.25 * (0.8 + 0.4 * Math.random()); res.ecal += e2; evs.push({ i: i, t: "ecal", p: pos.clone(), e: e2, mip: true }); changeMom(mom, -0.25); }
        if (d.kind === "had") {
          if (early) { ecalHad = (0.1 + Math.random() * 0.25) * Enow(); res.ecal += ecalHad; evs.push({ i: i, t: "ecal", p: pos.clone(), e: ecalHad, had: true }); }
          else if (d.q !== 0) { var e3 = 0.3 * (0.8 + 0.4 * Math.random()); ecalHad = e3; res.ecal += e3; evs.push({ i: i, t: "ecal", p: pos.clone(), e: e3, mip: true }); }
        }
      }
      if (!inHcal && r0 < R_HCAL[0] && r1 >= R_HCAL[0]) inHcal = true;
      if (d.kind === "had" && inHcal && r1 >= hadStopR) {
        var e4 = smearHcal(Math.max(0.3, Enow() - ecalHad)); res.hcal = e4;
        evs.push({ i: i, t: "hcal", p: pos.clone(), e: e4, full: true, rs: hadStopR }); res.stop = "hcal"; break;
      }
      if (d.kind === "mu" && !hcalMipDone && r0 < 2.36 && r1 >= 2.36) {
        hcalMipDone = true; var e5 = 1.6 * (0.75 + 0.5 * Math.random()); res.hcal += e5;

      res.ch > 0 ? ["히트", "on"] : ["없음", ""]
    ];
    for (var i = 0; i < 4; i++) { var td = row.cells[i + 1]; td.textContent = vals[i][0]; td.className = vals[i][1]; }
    fpDone[cat] = 1;
  }

  // 6) 기록표
  var recSec = ui.section(panel, "기록표", "사건이 끝나면 [기록]을 눌러 측정값을 저장하세요.");
  var recRow = ui.buttonRow(recSec);
  ui.button(recRow, { label: "기록", kind: "primary", id: "btn-rec", onClick: function () { recordCurrent(); } });
  var rec = K.Recorder(recSec, { id: "t05", columns: [
    { key: "name", label: "입자" }, { key: "pt", label: "p_T", unit: "GeV/c", digits: 3 }, { key: "r", label: "r", unit: "m", digits: 3 },
    { key: "pc", label: "0.3·B·r", unit: "GeV/c", digits: 3 }, { key: "ecal", label: "ECAL", unit: "GeV", digits: 3 },
    { key: "hcal", label: "HCAL", unit: "GeV", digits: 3 }, { key: "mu", label: "뮤온 히트" }
  ], onChange: function () { drawPlot(); checkM3(); } });
  function recordCurrent() {
    if (!ev || !ev.done) { K.toast("사건이 끝난 뒤 [기록]을 누르세요."); return; }
    if (ev.recorded) { K.toast("이 사건은 이미 기록했어요. 새로 발사하세요."); return; }
    var r = ev.res, ch = ev.d.q !== 0;
    rec.add({ name: ev.quiz ? "수수께끼 " + (quiz.k + 1) : ev.d.label, pt: r.pT, r: ch ? r.rMeas : "–", pc: ch ? 0.3 * B_IN * r.rMeas : "–",
      ecal: ev.live.ecal, hcal: ev.live.hcal, mu: ev.live.ch, charged: ch ? 1 : 0 });
    ev.recorded = true;
  }
  function checkM3() {
    var ps = [];
    rec.rows.forEach(function (row) { if (row.charged && typeof row.r === "number") { if (!ps.some(function (x) { return Math.abs(x - row.pt) < 0.5; })) ps.push(row.pt); } });
    if (ps.length >= 3) mission.complete(3, "미션 4 완료! r은 p_T에 비례해요 (p = 0.3·B·r).");
  }

  // 7) 그래프
  var plotSec = ui.section(panel, "r–p_T 그래프", "기록한 하전 입자의 궤도 반지름(점)과 이론선 r = p<sub>T</sub> / (0.3 × 3.8 T).");
  var cv = document.createElement("canvas"); cv.className = "plot"; cv.setAttribute("aria-label", "궤도 반지름과 횡운동량 그래프"); plotSec.appendChild(cv);
  function drawPlot() {
    var pts = [];
    rec.rows.forEach(function (row) { if (row.charged && typeof row.r === "number") pts.push([row.pt, row.r]); });
    var xmax = 25; pts.forEach(function (p) { xmax = Math.max(xmax, p[0] * 1.1); });
    var theory = [[0, 0], [xmax, xmax / (0.3 * B_IN)]];
    K.plot.xy(cv, { series: [
      { points: theory, line: true, dots: false, color: "#f0a35e", label: "이론 r = p_T/(0.3B)" },
      { points: pts, color: "#ff5d8f", label: "측정(기록)", r: 4 }
    ], xr: [0, xmax], yr: [0, xmax / (0.3 * B_IN) * 1.05], xlabel: "횡운동량 p_T (GeV/c)", ylabel: "r (m)" });
  }
  drawPlot();
  window.addEventListener("resize", drawPlot);

  // 8) 수수께끼 입자 퀴즈
  var qSec = ui.section(panel, "수수께끼 입자 퀴즈", "입자 이름을 숨긴 채 5개를 발사합니다. 흔적(트랙·휘는 방향·ECAL·HCAL·뮤온 챔버)으로 정체를 맞혀 보세요. 휘는 방향을 보려면 [정면 보기]가 편해요.");
  var qStatus = ui.html(qSec, "준비되면 [퀴즈 시작]을 누르세요.", "quiz-status");
  var qRow = ui.buttonRow(qSec);
  var bStart = ui.button(qRow, { label: "퀴즈 시작", kind: "primary", onClick: function () { startQuiz(); } });
  var bReplay = ui.button(qRow, { label: "다시 보기", onClick: function () { if (quiz.active) fireQuiz(); } });
  var ANS = [
    { value: "", label: "— 정체를 고르세요 —" }, { value: "em", label: "전자 e⁻" }, { value: "ep", label: "양전자 e⁺" },
    { value: "mum", label: "뮤온 μ⁻" }, { value: "mup", label: "반뮤온 μ⁺" }, { value: "chp", label: "양전하 강입자 (π⁺ 또는 p)" },
    { value: "chm", label: "음전하 강입자 (π⁻)" }, { value: "g", label: "광자 γ" }, { value: "n", label: "중성 강입자 (중성자 n)" }, { value: "nu", label: "중성미자 ν" }
  ];
  var qSel = ui.select(qSec, { id: "qans", label: "내 판단", value: "", options: ANS });
  var qRow2 = ui.buttonRow(qSec);
  var bCheck = ui.button(qRow2, { label: "정답 확인", onClick: function () { checkQuiz(); } });
  var bNext = ui.button(qRow2, { label: "다음 문제", onClick: function () { nextQuiz(); } });
  var qLog = document.createElement("ol"); qLog.className = "quiz-log"; qSec.appendChild(qLog);
  bReplay.disabled = bCheck.disabled = bNext.disabled = true;

  var EXPLAIN = {
    em: "트랙이 있고(하전), ECAL에서 에너지를 모두 내놓고 멈춤. 휘는 방향이 음전하 쪽(정면에서 반시계).",
    ep: "트랙이 있고 ECAL에서 멈춤. 휘는 방향이 양전하 쪽(정면에서 시계 방향) → 양전자.",
    mum: "트랙이 모든 층을 뚫고 뮤온 챔버에 히트. 정면에서 반시계 방향으로 휨 → 음전하 뮤온.",
    mup: "트랙이 모든 층을 뚫고 뮤온 챔버에 히트. 정면에서 시계 방향으로 휨 → 양전하 반뮤온.",
    chp: "트랙이 있고 HCAL에서 큰 에너지를 내놓고 멈춤(강입자). 시계 방향 → 양전하.",
    chm: "트랙이 있고 HCAL에서 멈춤(강입자). 반시계 방향 → 음전하.",
    g: "트랙이 없는데 ECAL에 큰 에너지 → 전기적으로 중성인 광자.",
    n: "트랙이 없는데 HCAL에 에너지 → 중성 강입자(중성자).",
    nu: "어떤 층에도 신호가 없음 → 중성미자. 실제 실험에서는 누락 횡운동량으로 추론."
  };
  var quiz = { active: false, items: [], k: 0, score: 0, answered: false, shotDone: false };
  function startQuiz() {
    var keys = ["em", "ep", "mum", "mup", "chp", "chm", "g", "n", "nu"];
    for (var i = keys.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = keys[i]; keys[i] = keys[j]; keys[j] = t; }
    quiz.items = keys.slice(0, 5).map(function (ans) {
      var type = ans === "chp" ? (Math.random() < 0.5 ? "pip" : "p") : (ans === "chm" ? "pim" : ans);
      return { ans: ans, type: type, p: Math.round(8 + Math.random() * 32), th: Math.round(75 + Math.random() * 30), ph: Math.round(Math.random() * 360) };
    });
    quiz.active = true; quiz.k = 0; quiz.score = 0; quiz.answered = false;
    qLog.innerHTML = "";
    if (demoOn) { demoOn = false; demoTgl.set(false); }
    bStart.textContent = "처음부터 다시";
    fireQuiz();
  }
  function fireQuiz() {
    var it = quiz.items[quiz.k];
    quiz.shotDone = false;
    fire(it.type, it.p, it.th, it.ph, { quiz: true });
    qStatus.innerHTML = "문제 <b>" + (quiz.k + 1) + " / 5</b> · 운동량 " + it.p + " GeV/c. 흔적을 관찰하세요.";
    bReplay.disabled = false; bCheck.disabled = quiz.answered; bNext.disabled = !quiz.answered;
  }
  function quizShotDone() { quiz.shotDone = true; if (!quiz.answered) qStatus.innerHTML = "문제 <b>" + (quiz.k + 1) + " / 5</b> · 정체를 고르고 [정답 확인]을 누르세요."; }
  function checkQuiz() {
    if (!quiz.active || quiz.answered) return;
    var v = qSel.get();
    if (!v) { K.toast("먼저 정체를 고르세요."); return; }
    var it = quiz.items[quiz.k], ok = v === it.ans;
    if (ok) quiz.score++;
    quiz.answered = true;
    var li = document.createElement("li");
    var ansLabel = ANS.filter(function (a) { return a.value === it.ans; })[0].label;
    li.innerHTML = (quiz.k + 1) + ". " + (ok ? '<span class="result-ok">정답</span>' : '<span class="result-bad">오답</span>') + " — " + ansLabel + (it.type === "p" ? " (실제: 양성자)" : (it.type === "pip" ? " (실제: π⁺)" : ""));
    qLog.appendChild(li);
    qStatus.innerHTML = (ok ? '<span class="result-ok">정답!</span> ' : '<span class="result-bad">아쉬워요.</span> ') + EXPLAIN[it.ans];
    hName.textContent = PT[it.type].label;
    bCheck.disabled = true; bNext.disabled = false;
    if (quiz.k === 4) bNext.textContent = "결과 보기";
  }
  function nextQuiz() {
    if (!quiz.active || !quiz.answered) return;
    if (quiz.k >= 4) {
      quiz.active = false; bReplay.disabled = bCheck.disabled = bNext.disabled = true; bNext.textContent = "다음 문제";
      qStatus.innerHTML = "퀴즈 끝! 점수 <b>" + quiz.score + " / 5</b>. " + (quiz.score >= 4 ? "훌륭해요." : "지문 표를 다시 보고 [처음부터 다시] 도전하세요.");
      if (quiz.score >= 4) mission.complete(4, "미션 5 완료! 수수께끼 입자 " + quiz.score + "/5");
      return;
    }
    quiz.k++; quiz.answered = false; qSel.set("");
    fireQuiz();
  }

  /* ================= 미션 판정 ================= */
  var firedMu = {};
  function onManualDone() {
    var r = ev.res;
    if (!r.looped && r.stop !== "trkz") { fillFP(ev.d.cat, r); }
    if (Object.keys(fpDone).length >= 6) mission.complete(1, "미션 2 완료! 신호 지문 표를 활동지에 옮겨 적으세요.");
    if ((ev.type === "mum" || ev.type === "mup") && r.ch >= 2) firedMu[ev.type] = 1;
    if (firedMu.mum && firedMu.mup) mission.complete(2, "미션 3 완료! 전하가 반대면 휘는 방향도 반대예요.");
  }

  /* ================= 자동 시연 ================= */
  var demoOn = true, demoWait = 0, demoK = 0;
  var DEMO = [["mum", 25, 30], ["em", 15, 150], ["g", 30, 250], ["pip", 20, 75], ["n", 25, 200], ["nu", 30, 320], ["mup", 12, 110], ["p", 18, 280]];
  function demoFire() { var d = DEMO[demoK % DEMO.length]; demoK++; fire(d[0], d[1], 90, d[2], {}); }

  /* ================= 매 프레임 ================= */
  sim.onFrame(function (dt, t, real) {
    // 충돌점 반짝임 줄이기
    if (vtx.scale.x > 1) { vtx.scale.setScalar(Math.max(1, vtx.scale.x - real * 6)); }
    if (!ev) { if (demoOn) demoFire(); return; }
    // 침착 블록 맥동, 소나기 흐려짐
    ev.objs.forEach(function (o) {
      if (o.userData.fade !== undefined) { o.userData.fade -= dt; o.material.opacity = Math.max(0, o.userData.fade / 1.2); o.visible = o.userData.fade > 0; }
      if (o.userData.pulse) { o.userData.pulse = Math.max(0, o.userData.pulse - dt * 1.5); o.material.opacity = Math.min(1, o.userData.base + o.userData.pulse * 0.5); }
    });
    if (!ev.done && dt > 0) {
      ev.s += BASE_SPEED * sSpeed.get() * dt;
      var target = Math.min(ev.pts.length - 1, Math.floor(ev.s / DS));
      while (ev.idx < target) {
        ev.idx++;
        if (ev.trail) ev.trail.push(ev.pts[ev.idx]);
        if (ev.beads) ev.beads.push(ev.pts[ev.idx]);
        while (ev.ptr < ev.evs.length && ev.evs[ev.ptr].i <= ev.idx) { processEvent(ev.evs[ev.ptr]); ev.ptr++; }
      }
      if (ev.head) ev.head.position.copy(ev.pts[ev.idx]);
      if (ev.idx >= ev.pts.length - 1) finishEvent();
    } else if (ev.done && demoOn && !quiz.active) {
      demoWait += real;
      if (demoWait > 1.6) demoFire();
    }
  });
})();
</script>
</body>
</html>
