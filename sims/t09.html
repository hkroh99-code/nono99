<body>
<div class="sim">

    <nav aria-label="관련 자료">

  <div class="sim-body">

    </div>

  </div>
</div>
<script src="../assets/vendor/three/three.min.js"></script>
<script src="../assets/vendor/three/OrbitControls.js"></script>
<script src="../assets/js/sim-kit.js"></script>
<script>
(function () {
  "use strict";
  var THREE = window.THREE, K = window.SimKit, ui = K.ui, COL = K.COLORS;
  var TWO_PI = Math.PI * 2;

  /* =========================================================
     1. 모의 사건 100개 (씨앗 고정 난수 → 언제 열어도 같은 사건)
     구성: W⁺→e⁺ν 24, W⁺→μ⁺ν 23, W⁻→e⁻ν̄ 16, W⁻→μ⁻ν̄ 17 (W⁺:W⁻ = 47:33 ≈ 1.4)
           Z→ee 4, Z→μμ 4 (W:Z = 80:8 = 10), 배경 12 / e:μ = 44:44
     앞의 6개는 연습용(유형별 1개씩), 나머지는 섞음
     ========================================================= */
  var CATS = [
    { key: "wpe", label: "W⁺ → e⁺ν", btn: "e⁺ν", boson: "Wp", flav: "e" },
    { key: "wme", label: "W⁻ → e⁻ν̄", btn: "e⁻ν̄", boson: "Wm", flav: "e" },
    { key: "wpm", label: "W⁺ → μ⁺ν", btn: "μ⁺ν", boson: "Wp", flav: "mu" },
    { key: "wmm", label: "W⁻ → μ⁻ν̄", btn: "μ⁻ν̄", boson: "Wm", flav: "mu" },
    { key: "zee", label: "Z → e⁺e⁻", btn: "ee (Z)", boson: "Z", flav: "e" },
    { key: "zmm", label: "Z → μ⁺μ⁻", btn: "μμ (Z)", boson: "Z", flav: "mu" },
    { key: "bg", label: "배경", btn: "배경", boson: "", flav: "" }
  ];
  var CAT = {}; CATS.forEach(function (c) { CAT[c.key] = c; });
  var MW = 80.37, GW = 2.085, MZ = 91.19, GZ = 2.50, ETA_MAX = 1.2, N_EV = 100;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var u = mulberry32(9090);
  function uni(a, b) { return a + (b - a) * u(); }
  function rint(a, b) { return a + Math.floor(u() * (b - a + 1)); }
  function gauss(m, s) { var x = 1 - u(), y = u(); return m + s * Math.sqrt(-2 * Math.log(x)) * Math.cos(TWO_PI * y); }
  function rexp(mean) { return -mean * Math.log(1 - u()); }
  function sgn() { return u() < 0.5 ? -1 : 1; }
  function wrap(p) { while (p <= -Math.PI) p += TWO_PI; while (p > Math.PI) p -= TWO_PI; return p; }
  function bw(m, g, lo, hi) { for (var i = 0; i < 1000; i++) { var x = m + 0.5 * g * Math.tan(Math.PI * (u() - 0.5)); if (x > lo && x < hi) return x; } return m; }
  function boost(v, bx, by, bz, g) {
    var b2 = bx * bx + by * by + bz * bz, bp = bx * v.px + by * v.py + bz * v.pz;
    var k = b2 > 0 ? (g - 1) * bp / b2 + g * v.E : 0;
    return { E: g * (v.E + bp), px: v.px + k * bx, py: v.py + k * by, pz: v.pz + k * bz };
  }
  function decay2(M, pT, y, phi) {
    var mT = Math.sqrt(M * M + pT * pT), E = mT * Math.cosh(y);
    var px = pT * Math.cos(phi), py = pT * Math.sin(phi), pz = mT * Math.sinh(y);
    var c = uni(-1, 1), s = Math.sqrt(1 - c * c), f = uni(0, TWO_PI), p = M / 2;
    var d1 = { E: p, px: p * s * Math.cos(f), py: p * s * Math.sin(f), pz: p * c };
    var d2 = { E: p, px: -d1.px, py: -d1.py, pz: -d1.pz };
    return [boost(d1, px / E, py / E, pz / E, E / M), boost(d2, px / E, py / E, pz / E, E / M)];
  }
  function kin(v) { var pt = Math.sqrt(v.px * v.px + v.py * v.py); return { pt: pt, eta: Math.asinh(v.pz / pt), phi: Math.atan2(v.py, v.px) }; }
  function four(t) { return { E: t.pt * Math.cosh(t.eta), px: t.pt * Math.cos(t.phi), py: t.pt * Math.sin(t.phi), pz: t.pt * Math.sinh(t.eta) }; }

  function addJet(ev, pt, eta, phi) {
    var n = rint(4, 7), w = [], sw = 0, i;
    for (i = 0; i < n; i++) { var x = 0.3 + u(); w.push(x); sw += x; }
    for (i = 0; i < n; i++) {
      var tp = Math.min(12, Math.max(4, 0.55 * pt * w[i] / sw));
      ev.parts.push({ kind: "h", q: sgn(), pt: tp, eta: eta + gauss(0, 0.08), phi: wrap(phi + gauss(0, 0.09)), z0: 0, lab: "" });
    }
    ev.jets.push({ pt: pt, eta: eta, phi: phi });
  }
  function lep(flav, q, v, lab) { var k = kin(v); return { kind: flav, q: q, pt: k.pt, eta: k.eta, phi: k.phi, z0: 0, lab: lab }; }
  function genW(ev, q, flav) {
    for (var t = 0; t < 500; t++) {
      var M = bw(MW, GW, 60, 100), pTW = Math.min(30, rexp(6)), y = uni(-2, 2), phW = uni(-Math.PI, Math.PI);
      var d = decay2(M, pTW, y, phW), l = lep(flav, q, d[0], "A"), nu = kin(d[1]);
      l.pt *= 1 + gauss(0, 0.02);
      var mx = nu.pt * Math.cos(nu.phi) + gauss(0, 3.5), my = nu.pt * Math.sin(nu.phi) + gauss(0, 3.5), met = Math.sqrt(mx * mx + my * my);
      if (Math.abs(l.eta) < ETA_MAX && l.pt > 25 && met > 20) {
        ev.parts.push(l); ev.met = { pt: met, phi: Math.atan2(my, mx) }; ev.nu = nu;
        if (pTW > 12) addJet(ev, pTW * uni(0.75, 1), uni(-ETA_MAX, ETA_MAX), wrap(phW + Math.PI + gauss(0, 0.2)));
        return;
      }
    }
  }
  function genZ(ev, flav) {
    for (var t = 0; t < 500; t++) {
      var M = bw(MZ, GZ, 70, 112), pTZ = Math.min(25, rexp(5)), y = uni(-1.4, 1.4), phZ = uni(-Math.PI, Math.PI);
      var d = decay2(M, pTZ, y, phZ), a = lep(flav, -1, d[0], ""), b = lep(flav, 1, d[1], "");
      a.pt *= 1 + gauss(0, 0.031); b.pt *= 1 + gauss(0, 0.031);
      if (Math.abs(a.eta) < ETA_MAX && Math.abs(b.eta) < ETA_MAX && a.pt > 20 && b.pt > 20) {
        if (a.pt >= b.pt) { a.lab = "A"; b.lab = "B"; ev.parts.push(a, b); } else { b.lab = "A"; a.lab = "B"; ev.parts.push(b, a); }
        var mx = gauss(0, 3.5), my = gauss(0, 3.5);
        ev.met = { pt: Math.sqrt(mx * mx + my * my), phi: Math.atan2(my, mx) }; ev.trueM = M;
        return;
      }
    }
  }
  function genBg(ev) {
    var lepJet = u() < 0.4;
    for (var t = 0; t < 500; t++) {
      var n0 = ev.parts.length, j0 = ev.jets.length;
      var p1 = 25 + Math.min(45, rexp(12)), e1 = uni(-ETA_MAX, ETA_MAX), f1 = uni(-Math.PI, Math.PI);
      var p2 = p1 * uni(0.84, 1), e2 = uni(-ETA_MAX, ETA_MAX), f2 = wrap(f1 + Math.PI + gauss(0, 0.12));
      if (lepJet) {
        var flav = u() < 0.5 ? "e" : "mu", lp = uni(18, 24);
        ev.parts.push({ kind: flav, q: sgn(), pt: lp, eta: e1 + gauss(0, 0.04), phi: wrap(f1 + gauss(0, 0.05)), z0: 0, lab: "A" });
        addJet(ev, p1 - lp * 0.3, e1, f1);
        ev.bgType = flav === "e" ? "제트 속에 묻힌 전자(고립 안 됨) + 작은 MET" : "제트 속에 묻힌 뮤온(고립 안 됨) + 작은 MET";
      } else { addJet(ev, p1, e1, f1); ev.bgType = "두 제트(QCD) 사건"; }
      addJet(ev, p2, e2, f2);
      var mx = -(p1 * Math.cos(f1) + p2 * Math.cos(f2)) + gauss(0, 3.5), my = -(p1 * Math.sin(f1) + p2 * Math.sin(f2)) + gauss(0, 3.5);
      var met = Math.sqrt(mx * mx + my * my);
      if (met < 15) { ev.met = { pt: met, phi: Math.atan2(my, mx) }; return; }
      ev.parts.length = n0; ev.jets.length = j0;
    }
  }
  function genPileup(ev) {
    var n = rint(6, 11);
    for (var i = 0; i < n; i++) ev.parts.push({ kind: "pu", q: sgn(), pt: Math.min(1.6, 0.3 + rexp(0.4)), eta: uni(-2.4, 2.4), phi: uni(-Math.PI, Math.PI), z0: gauss(0, 0.05), lab: "" });
    var m = rint(4, 8);
    for (var j = 0; j < m; j++) ev.noise.push({ eta: uni(-1.4, 1.4), phi: uni(-Math.PI, Math.PI), ecal: uni(0.3, 1.2), hcal: uni(0.5, 2.5) });
  }

  var order = ["wpm", "wme", "zmm", "bg", "zee", "wpe"];
  var rest = [];
  [["wpe", 23], ["wpm", 22], ["wme", 15], ["wmm", 17], ["zee", 3], ["zmm", 3], ["bg", 11]].forEach(function (c) { for (var i = 0; i < c[1]; i++) rest.push(c[0]); });
  for (var si = rest.length - 1; si > 0; si--) { var sj = Math.floor(u() * (si + 1)); var tmp = rest[si]; rest[si] = rest[sj]; rest[sj] = tmp; }
  order = order.concat(rest);
  var EVENTS = order.map(function (cat, i) {
    var ev = { n: i + 1, cat: cat, parts: [], jets: [], noise: [], met: { pt: 0, phi: 0 }, bgType: "" };
    if (cat === "wpe") genW(ev, 1, "e"); else if (cat === "wme") genW(ev, -1, "e");
    else if (cat === "wpm") genW(ev, 1, "mu"); else if (cat === "wmm") genW(ev, -1, "mu");
    else if (cat === "zee") genZ(ev, "e"); else if (cat === "zmm") genZ(ev, "mu"); else genBg(ev);
    genPileup(ev);
    ev.labeled = ev.parts.filter(function (p) { return p.lab; });
    ev.mass = ev.labeled.length === 2 ? K.invariantMass([four(ev.labeled[0]), four(ev.labeled[1])]) : null;
    return ev;
  });

  /* =========================================================
     2. 장면과 검출기 (단위: m, 빔 = z축, 자기장 3.8 T는 +z 방향)
     ========================================================= */
  var stageEl = document.getElementById("stage");
  var VIEW3D = [9.6, 5.6, 11.6];
  var sim = K.create({ stage: stageEl, cameraPos: VIEW3D, target: [0, 0, 0], grid: false, fov: 45 });
  var scene = sim.scene, controls = sim.controls;
  controls.autoRotate = true; controls.autoRotateSpeed = 0.7;

  var GEO = { trk: 1.2, trkZ: 2.8, ecal0: 1.3, ecal1: 1.55, hcal0: 1.8, hcal1: 2.9, sol: 3.05, mu: [4.0, 4.9, 5.9, 6.9], muZ: 6.6, disks: [7.0, 8.0, 9.0], rOut: 7.3, zOut: 9.8 };
  var detector = new THREE.Group(); scene.add(detector);
  function shell(r, len, color, op) {
    var m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 72, 1, true),
      new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: op, side: THREE.DoubleSide, depthWrite: false }));
    m.rotation.x = Math.PI / 2; detector.add(m); return m;
  }
  function ring(r, z, color, op) {
    var pts = []; for (var i = 0; i <= 96; i++) { var a = TWO_PI * i / 96; pts.push(new THREE.Vector3(r * Math.cos(a), r * Math.sin(a), z)); }
    var l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: op }));
    detector.add(l); return l;
  }
  (function buildDetector() {
    var beam = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, -11), new THREE.Vector3(0, 0, 11)]), new THREE.LineBasicMaterial({ color: 0x55608a }));
    detector.add(beam);
    shell(GEO.trk, GEO.trkZ * 2, 0x7f9cff, 0.06);
    [-GEO.trkZ, 0, GEO.trkZ].forEach(function (z) { ring(GEO.trk, z, 0x7f9cff, 0.45); });
    [0.35, 0.7].forEach(function (r) { ring(r, 0, 0x7f9cff, 0.18); });
    shell(GEO.ecal0, 6.0, 0x5fd08a, 0.05); shell(GEO.ecal1, 6.0, 0x5fd08a, 0.05);
    [-3, 3].forEach(function (z) { ring(GEO.ecal0, z, 0x5fd08a, 0.35); ring(GEO.ecal1, z, 0x5fd08a, 0.35); });
    shell(GEO.hcal0, 8.6, 0xff9f43, 0.04); shell(GEO.hcal1, 8.6, 0xff9f43, 0.04);
    [-4.3, 4.3].forEach(function (z) { ring(GEO.hcal0, z, 0xff9f43, 0.3); ring(GEO.hcal1, z, 0xff9f43, 0.3); });
    shell(GEO.sol, 12.5, 0x8899cc, 0.09);
    [-6.25, 6.25].forEach(function (z) { ring(GEO.sol, z, 0x8899cc, 0.5); });
    var muMat = new THREE.MeshBasicMaterial({ color: COL.muon, transparent: true, opacity: 0.016, depthWrite: false, side: THREE.DoubleSide });
    var edgeMat = new THREE.LineBasicMaterial({ color: COL.muon, transparent: true, opacity: 0.09 });
    var box = new THREE.BoxGeometry(1, 1, 1), edges = new THREE.EdgesGeometry(box);
    GEO.mu.forEach(function (r) {
      for (var k = 0; k < 12; k++) {
        var a = (k + 0.5) * TWO_PI / 12, w = 2 * r * Math.tan(Math.PI / 12) * 0.92;
        var m = new THREE.Mesh(box, muMat); m.scale.set(0.2, w, GEO.muZ * 2); m.rotation.z = a; m.position.set(r * Math.cos(a), r * Math.sin(a), 0);
        var e = new THREE.LineSegments(edges, edgeMat); e.scale.copy(m.scale); e.rotation.z = a; e.position.copy(m.position);
        detector.add(m); detector.add(e);
      }
    });
    var diskMat = new THREE.MeshBasicMaterial({ color: COL.muon, transparent: true, opacity: 0.012, depthWrite: false, side: THREE.DoubleSide });
    GEO.disks.forEach(function (z) {
      [-z, z].forEach(function (zz) {
        var d = new THREE.Mesh(new THREE.RingGeometry(1.5, 7.0, 48), diskMat); d.position.z = zz; detector.add(d);
        ring(7.0, zz, COL.muon, 0.12); ring(1.5, zz, COL.muon, 0.12);
      });
    });
  })();
  var labels = new THREE.Group(); scene.add(labels);
  [["트래커", 0.75, -3.3], ["ECAL", 1.45, -3.6], ["HCAL", 2.35, -4.8], ["솔레노이드 3.8 T", 3.15, -6.7], ["뮤온 챔버", 5.4, -7.2]].forEach(function (l) {
    var s = K.label(l[0], { height: 0.42, color: "#a9b0c8" }); s.position.set(0, l[1], l[2]); labels.add(s);
  });

  /* =========================================================
     3. 사건 그리기
     ========================================================= */
  var state = { cur: 0, mag: 3, hint: false, ref: true, pu: true, revealed: false, autoNext: false, view: "3d", labels: true };
  var evGroup = null, anim = { t: 1, tracks: [], towers: [], late: [], met: [] };
  var matCache = {};
  function mat(color, opts) {
    var key = color + JSON.stringify(opts || {});
    if (!matCache[key]) {
      var o = opts || {};
      matCache[key] = o.lambert ? new THREE.MeshLambertMaterial({ color: color, emissive: color, emissiveIntensity: 0.35, transparent: !!o.op, opacity: o.op || 1 })
        : new THREE.MeshBasicMaterial({ color: color, transparent: !!o.op, opacity: o.op || 1 });
    }
    matCache[key].userData.cached = true;
    return matCache[key];
  }
  var NEUTRAL = 0xe6e9f4;
  function partColor(p) {
    if (!(state.hint || state.revealed)) return p.kind === "pu" ? 0x8a93b0 : NEUTRAL;
    if (p.kind === "e") return COL.electron;
    if (p.kind === "mu") return COL.muon;
    if (p.kind === "h") return COL.hadron;
    return 0x8a93b0;
  }
  /* 나선 궤적: 솔레노이드 안 3.8 T, 바깥(철 요크) −1.8 T. 화면용으로 곡률을 state.mag배 과장 */
  function propagate(p) {
    var mag = state.mag, x = 0, y = 0, z = p.z0 || 0, phi = p.phi, sh = Math.sinh(p.eta), ds = 0.02, s = 0;
    var kIn = -p.q * 0.3 * 3.8 * mag / p.pt, kOut = p.q * 0.3 * 1.8 * mag / p.pt;
    var isMu = p.kind === "mu", rStop = isMu ? GEO.rOut : 1.25, zStop = isMu ? GEO.zOut : GEO.trkZ;
    var rc = p.pt / (0.3 * 3.8 * mag), maxS = isMu ? 40 : Math.min(3 * TWO_PI * rc, 14);
    var pts = [new THREE.Vector3(x, y, z)], hits = [], st = 0, diskDone = {}, exit = null, n = 0;
    while (s < maxS) {
      var r = Math.sqrt(x * x + y * y), k = r < 2.95 ? kIn : (r > 3.15 ? kOut : 0);
      phi += k * ds; x += Math.cos(phi) * ds; y += Math.sin(phi) * ds; z += sh * ds; s += ds; n++;
      var r2 = Math.sqrt(x * x + y * y);
      if (isMu) {
        if (st < GEO.mu.length && r2 >= GEO.mu[st]) { if (Math.abs(z) < GEO.muZ) hits.push({ x: x, y: y, z: z, end: false }); st++; }
        for (var d = 0; d < GEO.disks.length; d++) {
          var D = GEO.disks[d];
          if (!diskDone[d] && Math.abs(z) >= D) { diskDone[d] = true; if (r2 > 1.5 && r2 < 7) hits.push({ x: x, y: y, z: z, end: true }); }
        }
      }
      if (n % 3 === 0) pts.push(new THREE.Vector3(x, y, z));
      if (r2 >= rStop || Math.abs(z) >= zStop) { pts.push(new THREE.Vector3(x, y, z)); exit = { x: x, y: y, z: z, r: r2, barrel: r2 >= rStop }; break; }

    ro.set("pm", rtxt(ratio(c.wp, c.wm))); ro.set("wz", rtxt(ratio(c.w, c.z)));
    var h = "<tr><th>분류</th><th>N</th><th>√N</th></tr>";
    CATS.forEach(function (k) { h += "<tr><td>" + k.label + "</td><td>" + c[k.key] + "</td><td>" + Math.sqrt(c[k.key]).toFixed(1) + "</td></tr>"; });
    h += '<tr class="sum"><td>W⁺ 합 / W⁻ 합</td><td>' + c.wp + " / " + c.wm + "</td><td></td></tr>";
    h += '<tr class="sum"><td>W 합 / Z 합</td><td>' + c.w + " / " + c.z + "</td><td></td></tr>";
    h += '<tr class="sum"><td>e/μ 비</td><td colspan="2">' + rtxt(ratio(c.e, c.mu)) + "</td></tr>";
    tallyTbl.innerHTML = h;
    drawHist(c);
    checkMissions(c);
    return c;
  }
  function checkMissions(c) {
    var t = c.okTypes;
    if (t.eW && t.muW && t.zee && t.zmm && t.bg) mission.complete(0, "미션 1 완료! 다섯 가지 신호 지문을 모두 익혔어요.");
    if (c.n >= 50) mission.complete(1, "미션 2 완료! 사건 50개를 분류했어요.");
    if (c.w >= 40) { var r = ratio(c.wp, c.wm); mission.complete(2, "미션 3 완료! W⁺/W⁻ = " + rtxt(r)); }
    if (c.masses.length >= 4 && c.zMean > 86 && c.zMean < 96) mission.complete(3, "미션 4 완료! Z 질량 피크 평균 " + c.zMean.toFixed(1) + " GeV");
    if (c.n === N_EV && c.ok / c.n >= 0.9) mission.complete(4, "미션 5 완료! 정확도 " + (100 * c.ok / c.n).toFixed(0) + " %로 100개를 모두 분류했어요.");
  }
  function recordSnapshot() {
    var c = tally();
    if (!c.n) { K.toast("먼저 사건을 분류하세요."); return; }
    rec.add({ n: c.n, wp: c.wp, wm: c.wm, z: c.z, bg: c.bg, pm: rtxt(ratio(c.wp, c.wm)), wz: rtxt(ratio(c.w, c.z)), acc: Math.round(100 * c.ok / c.n) });
    K.toast("현재 집계를 기록했어요 (분류 " + c.n + "개).");
  }

  /* =========================================================
     5. 화면 갱신, 조작
     ========================================================= */
  function f1(x) { return x.toFixed(1); }
  function deg(phi) { var d = phi * 180 / Math.PI; if (d < 0) d += 360; return Math.round(d) % 360; }
  function updateHud() {
    var ev = EVENTS[state.cur], k = cls[state.cur];
    var h = '<div class="row"><span class="k">사건</span> <span class="v">' + ev.n + "</span><span class=\"k\"> / " + N_EV + "</span></div>";
    h += '<div class="row"><span class="k">내 분류</span> <span class="v">' + (k ? CAT[k].label : "–") + "</span></div>";
    if (state.revealed) {
      var ok = k === ev.cat;
      h += '<div class="row"><span class="k">정답</span> <span class="' + (ok ? "truth-ok" : "truth-bad") + '">' + CAT[ev.cat].label + (ok ? " (맞음)" : " (다름)") + "</span></div>";
    }
    document.getElementById("hud-ev").innerHTML = h;
    var t = "";
    ev.labeled.forEach(function (p) {
      t += '<div class="row"><span class="lab">' + p.lab + '</span><span class="k">p<sub>T</sub></span> <span class="v">' + f1(p.pt) + ' GeV</span> <span class="k">η</span> <span class="v">' + (p.eta >= 0 ? "+" : "−") + Math.abs(p.eta).toFixed(2) + '</span> <span class="k">φ</span> <span class="v">' + deg(p.phi) + "°</span></div>";
    });
    if (!ev.labeled.length) t += '<div class="row"><span class="k">p<sub>T</sub> 15 GeV 넘는 트랙 없음</span></div>';
    t += '<div class="row"><span class="lab">MET</span><span class="v">' + f1(ev.met.pt) + ' GeV</span> <span class="k">φ</span> <span class="v">' + deg(ev.met.phi) + "°</span></div>";
    if (ev.mass) t += '<div class="row"><span class="k">M(A,B)</span> <span class="v">' + f1(ev.mass) + " GeV</span></div>";
    document.getElementById("hud-trk").innerHTML = t;
    var realR = ev.labeled.length ? ev.labeled[0].pt / (0.3 * 3.8) : 35;
    document.getElementById("hud-scale").innerHTML = "자기장 3.8 T (빔 방향)<br>곡률 ×" + state.mag + " 과장 · 트랙 A의 실제 반지름 " + realR.toFixed(0) + " m<br>단위: m · GeV · 검출기 바깥 반지름 7.3 m";
  }
  function updatePanel() {
    var k = cls[state.cur];
    evNo.textContent = (state.cur + 1) + " / " + N_EV;
    prevBtn.disabled = state.cur === 0; nextBtn.disabled = state.cur === N_EV - 1;
    CATS.forEach(function (c) { clsBtns[c.key].classList.toggle("sel", c.key === k); clsBtns[c.key].setAttribute("aria-pressed", c.key === k ? "true" : "false"); });
    revealBtn.disabled = !k;
    revealBtn.textContent = state.revealed ? "정답 숨기기" : "정답 보기";
    if (!k) status.innerHTML = "아직 분류하지 않은 사건입니다.";
    else if (state.revealed) {
      var ev = EVENTS[state.cur], ok = k === ev.cat;
      var why = ev.cat === "bg" ? ev.bgType : (ev.labeled.map(function (p) { return p.lab + " = " + partName(p); }).join(", ") + ", MET " + f1(ev.met.pt) + " GeV");
      status.innerHTML = (ok ? '<span class="result-ok">맞음</span> ' : '<span class="result-bad">다름</span> ') + "정답: <b>" + CAT[ev.cat].label + "</b> · " + why;
    } else status.innerHTML = "내 분류: <b>" + CAT[k].label + "</b> — [정답 보기]로 확인하세요.";
  }
  function go(i) {
    if (i < 0 || i >= N_EV) return;
    state.cur = i; state.revealed = false;
    buildEvent(EVENTS[i], true); updateHud(); updatePanel();
  }
  function nextUnclassified() {
    for (var d = 1; d <= N_EV; d++) { var j = (state.cur + d) % N_EV; if (!cls[j]) { go(j); return; } }
    K.toast("모든 사건을 분류했어요!");
  }
  function classify(key) {
    cls[state.cur] = key; persist();
    var c = refreshTally();
    updatePanel(); updateHud();
    if (state.autoNext && state.cur < N_EV - 1) setTimeout(function () { go(state.cur + 1); }, 250);
    void c;
  }
  function setReveal(v) {
    if (!cls[state.cur]) { K.toast("먼저 분류한 뒤에 정답을 볼 수 있어요."); return; }
    state.revealed = v; buildEvent(EVENTS[state.cur], false); updateHud(); updatePanel();
  }
  /* 시점: 정면·확대·측면은 좁은 화각으로 멀리서 봐서 원근 왜곡을 줄임 */
  function setFov(f) { sim.camera.fov = f; sim.camera.updateProjectionMatrix(); }
  function applyLabelScale() {
    var k = state.view === "zoom" ? 0.4 : (state.view === "end" ? 1.3 : 1);
    if (evGroup) evGroup.traverse(function (o) { if (o.userData && o.userData.base) o.scale.copy(o.userData.base).multiplyScalar(k); });
    labels.visible = state.labels && state.view !== "zoom";
  }
  function setView(v) {
    state.view = v;
    if (v === "3d") { setFov(45); sim.setView(VIEW3D, [0, 0, 0]); }
    else {
      controls.autoRotate = false; rotT.set(false);
      if (v === "end") { setFov(26); sim.setView([0, 0, 33], [0, 0, 0]); }
      else if (v === "zoom") { setFov(13); sim.setView([0, 0, 17], [0, 0, 0]); }
      else if (v === "side") { setFov(30); sim.setView([40, 0.01, 0], [0, 0, 0]); }
    }
    applyLabelScale();
  }
  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (/INPUT|TEXTAREA|SELECT/.test(tag) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "ArrowRight") { go(state.cur + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { go(state.cur - 1); e.preventDefault(); }
    else if (/^[1-7]$/.test(e.key)) classify(CATS[+e.key - 1].key);
  });
  window.addEventListener("resize", function () { drawHist(tally()); });

  go(0);
  refreshTally();
  /* 확인·시험용(지도서 예시 값 검증) */
  window.T09Sim = { events: EVENTS, classify: classify, go: go, tally: tally, info: function () { return { cur: state.cur, mag: state.mag, t: anim.t, late: anim.late.length, lateVis: anim.late.filter(function (o) { return o.visible; }).length, towers: anim.towers.length }; } };
})();
</script>
