<!doctype html>
<html lang="ko">
<head>

<title>물질 속으로 줌인 모의실험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../assets/css/sim.css">
<style>
  .hud b { color: var(--s-track); font-weight: 600; }

  #hud-main { max-width: 420px; }
  .mode-row .sbtn { flex: 1 1 auto; }

  .info-card { background: var(--s-panel-2); border: 1px solid var(--s-line); border-radius: 8px; padding: .7rem .8rem; display: grid; gap: .35rem; font-size: .86rem; }
  .info-card h3 { margin: 0; font-size: 1rem; font-family: var(--font-display); font-weight: 600; }
  .info-card dl { display: grid; grid-template-columns: auto 1fr; gap: .2rem .7rem; margin: 0; }
  .info-card dt { color: var(--s-ink-3); }
  .info-card dd { margin: 0; font-family: var(--font-mono); font-size: .84rem; }

  .ratio-form { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; font-size: .86rem; }

  .feedback { font-size: .84rem; color: var(--s-ink-2); }
  .q-row .sbtn { min-width: 2.8rem; font-family: var(--font-mono); font-size: .95rem; }
  .q-u { border-color: #ff6b6b !important; color: #ffb0b0 !important; }
  .q-d { border-color: #4dabf7 !important; color: #a8d8ff !important; }
  .q-s { border-color: #c78bff !important; color: #e0c4ff !important; }
  .verdict { font-size: .95rem; font-weight: 700; }
  @media (max-width: 560px) { .hud { font-size: .74rem; padding: .35rem .5rem; } }
</style>
</head>
<body>
<div class="sim">
  <header class="sim-head">
    <span class="tag">주제 01 · 3D</span>
    <h1>물질 속으로 줌인 · 표준모형 갤러리</h1>
    <nav aria-label="관련 자료">
      <a href="../students/t01.html">학생용 활동지</a>
      <a href="../teachers/t01.html">교사용 지도서</a>
      <a href="index.html">모의실험 목록</a>
    </nav>
  </header>
  <div class="sim-body">
    <div class="stage" id="stage">
      <div class="stage-overlay" id="overlay">
        <div class="hud" id="hud-main"></div>
        <div class="hud" id="hud-scale"></div>
      </div>
      <div class="stage-hint" id="hint">드래그: 회전 · 휠/두 손가락: 확대(물질 속으로)</div>
    </div>
    <aside class="panel" id="panel" aria-label="조작과 기록"></aside>
  </div>
</div>
<script src="../assets/vendor/three/three.min.js"></script>
<script src="../assets/vendor/three/OrbitControls.js"></script>
<script src="../assets/js/sim-kit.js"></script>
<script>
(function () {
  "use strict";
  var THREE = window.THREE, K = window.SimKit, ui = K.ui, COL = K.COLORS;
  var stage = document.getElementById("stage"), panel = document.getElementById("panel");
  var sim = K.create({ stage: stage, cameraPos: [0, 1.2, 10], target: [0, 0, 0], grid: false });
  var scene = sim.scene;
  var COL_S = 0xc78bff, COL_TAU = 0xc78bff, COL_WZ = COL.field, COL_H = 0xf3e6ff;
  function sup(n) { var m = { "-": "⁻", "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹" }; return String(n).split("").map(function (c) { return m[c] || c; }).join(""); }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function ramp(x, a, b) { return clamp((x - a) / (b - a), 0, 1); }
  function glowTexture() {
    var cv = document.createElement("canvas"); cv.width = cv.height = 64;
    var g = cv.getContext("2d"), grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, "rgba(255,255,255,1)"); grd.addColorStop(0.35, "rgba(255,255,255,.45)"); grd.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grd; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(cv);
  }
  var GLOW = glowTexture();
  function fadeable(mat, base) { mat.transparent = true; mat.userData.base = base === undefined ? (mat.opacity === undefined ? 1 : mat.opacity) : base; return mat; }

  /* =========================================================
     1) 줌인 모드: 물방울 → 물 분자 → 산소 원자 → 원자핵 → 양성자
     각 단계는 '특징 크기 1'로 만든 뒤, 보는 크기(10^viewLog m)에 맞춰 크기를 바꾼다.
     ========================================================= */
  var zoomRoot = new THREE.Group(); scene.add(zoomRoot);
  var LV = [
    { key: "drop", name: "물방울", L: 1e-3, size: "약 1×10⁻³ m (1 mm)", exp: -3, charge: "0", inA: 0, inB: 0, outA: 2, outB: 6,
      desc: "물 분자 약 2×10¹⁹개가 모여 있습니다. 눈으로 볼 수 있는 가장 작은 크기에 가깝습니다." },
    { key: "mol", name: "물 분자 H₂O", L: 2.8e-10, size: "약 2.8×10⁻¹⁰ m (0.28 nm)", exp: -10, charge: "0", inA: 0.04, inB: 0.15, outA: 1.6, outB: 3.2,
      desc: "산소 원자 1개와 수소 원자 2개가 104.5°로 결합해 있습니다. 분자들은 끊임없이 흔들리고 움직입니다." },
    { key: "atom", name: "산소 원자", L: 1e-10, size: "약 1×10⁻¹⁰ m (0.1 nm)", exp: -10, charge: "0 (중성)", inA: 0.35, inB: 0.75, outA: 3, outB: 9,
      desc: "전자 8개가 '전자 구름'처럼 퍼져 있습니다. 원자핵은 원자 지름의 약 2만분의 1이라 이 화면에서는 보이지 않습니다." },
    { key: "nuc", name: "산소 원자핵 (양성자 8 + 중성자 8)", L: 6e-15, size: "약 6×10⁻¹⁵ m (6 fm)", exp: -15, charge: "+8", inA: 0.02, inB: 0.08, outA: 1.8, outB: 3.2,
      desc: "양성자(빨강)와 중성자(회색)가 강한 핵력으로 뭉쳐 있습니다. 원자 질량의 99.9% 이상이 여기에 있습니다." },
    { key: "p", name: "양성자 (u u d + 글루온)", L: 1.7e-15, size: "약 1.7×10⁻¹⁵ m", exp: -15, charge: "+1", inA: 0.3, inB: 0.6, outA: 1e9, outB: 2e9,
      desc: "위 쿼크 2개와 아래 쿼크 1개가 글루온으로 묶여 있습니다. 쿼크 질량의 합은 양성자 질량의 약 1%뿐이고, 나머지는 쿼크·글루온의 운동과 결합 에너지에서 나옵니다." }
  ];
  LV.forEach(function (lv) { lv.log = Math.log10(lv.L); lv.group = new THREE.Group(); lv.mats = []; zoomRoot.add(lv.group); });
  function addMesh(lv, geo, mat, parent) { var m = new THREE.Mesh(geo, fadeable(mat)); (parent || lv.group).add(m); lv.mats.push(mat); return m; }

  // 물방울
  (function () {
    var lv = LV[0];
    lv.drop = addMesh(lv, new THREE.SphereGeometry(0.5, 64, 32), new THREE.MeshPhongMaterial({ color: 0x3d8bff, opacity: 0.7, shininess: 70, specular: 0x6f9fd8, emissive: 0x05162e }));
    var hl = addMesh(lv, new THREE.SphereGeometry(0.08, 16, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.7 }));
    hl.position.set(-0.17, 0.2, 0.38); hl.scale.set(1, 0.6, 0.4);
  })();

  // 물 분자들
  (function () {
    var lv = LV[1];
    var oGeo = new THREE.SphereGeometry(0.17, 24, 16), hGeo = new THREE.SphereGeometry(0.105, 16, 12), bGeo = new THREE.CylinderGeometry(0.03, 0.03, 1, 8);
    var oMat = fadeable(new THREE.MeshPhongMaterial({ color: 0xe0503c, shininess: 60 })), hMat = fadeable(new THREE.MeshPhongMaterial({ color: 0xf2f2f2 })), bMat = fadeable(new THREE.MeshPhongMaterial({ color: 0x9aa3bf }));
    var oMatC = fadeable(new THREE.MeshPhongMaterial({ color: 0xe0503c, shininess: 60 }));
    lv.mats.push(oMat, hMat, bMat);
    lv.oMatC = oMatC;
    var ang = 104.5 * Math.PI / 180, bl = 0.34;
    function molecule(center) {
      var g = new THREE.Group();
      g.add(new THREE.Mesh(oGeo, center ? oMatC : oMat));
      [-1, 1].forEach(function (sgn) {
        var hx = Math.sin(ang / 2) * bl * sgn, hy = -Math.cos(ang / 2) * bl;
        var h = new THREE.Mesh(hGeo, hMat); h.position.set(hx, hy, 0); g.add(h);
        var b = new THREE.Mesh(bGeo, bMat); b.position.set(hx / 2, hy / 2, 0); b.scale.y = bl;
        b.rotation.z = Math.atan2(hy, hx) - Math.PI / 2; g.add(b);
      });
      return g;
    }
    lv.center = molecule(true); lv.group.add(lv.center);
    lv.others = [];
    var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var i = 0, tries = 0; i < 20 && tries < 500; tries++) {
      var r = 0.95 + 0.85 * rnd(), u = rnd() * 2 - 1, ph = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      var px = r * s * Math.cos(ph), py = r * u, pz = r * s * Math.sin(ph);
      if (pz > 0 && Math.hypot(px, py) < 1.1) continue; // 가운데 분자를 가리지 않게
      if (lv.others.some(function (o) { return o.userData.p0.distanceTo(new THREE.Vector3(px, py, pz)) < 0.75; })) continue;
      i++;
      var m = molecule(false); m.position.set(px, py, pz);
      m.rotation.set(rnd() * 6.28, rnd() * 6.28, rnd() * 6.28);
      m.userData = { p0: m.position.clone(), w: 0.6 + rnd(), ph: rnd() * 6.28, rs: [rnd() - 0.5, rnd() - 0.5, rnd() - 0.5] };
      lv.group.add(m); lv.others.push(m);
    }
  })();

  // 산소 원자: 전자 구름(확률 분포를 점으로)
  (function () {
    var lv = LV[2], N = 4200, pos = new Float32Array(N * 3);
    function gamma3(a) { return -a * Math.log(Math.random() * Math.random() * Math.random() + 1e-12); }
    function sample(i) {
      var inner = i % 5 === 0, r = inner ? gamma3(0.018) : gamma3(0.075);
      var x, y, z, u, ph, s;
      if (!inner && i % 5 > 2) { // 2p 오비탈 느낌: 축 방향 아령 모양
        var ax = i % 3; do { u = Math.random() * 2 - 1; ph = Math.random() * 6.283; s = Math.sqrt(1 - u * u); x = s * Math.cos(ph); y = u; z = s * Math.sin(ph); } while (Math.random() > [x, y, z][ax] * [x, y, z][ax]);
      } else { u = Math.random() * 2 - 1; ph = Math.random() * 6.283; s = Math.sqrt(1 - u * u); x = s * Math.cos(ph); y = u; z = s * Math.sin(ph); }
      r = Math.min(r, 0.6);
      pos[3 * i] = r * x; pos[3 * i + 1] = r * y; pos[3 * i + 2] = r * z;
    }
    for (var i = 0; i < N; i++) sample(i);
    var geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    var mat = fadeable(new THREE.PointsMaterial({ color: COL.electron, size: 0.045, opacity: 0.8, depthWrite: false }));
    lv.cloud = new THREE.Points(geo, mat); lv.group.add(lv.cloud); lv.mats.push(mat);
    lv.resample = function (k) { for (var j = 0; j < k; j++) sample(Math.floor(Math.random() * N)); geo.attributes.position.needsUpdate = true; };
    // 원자핵 위치 표시(크기를 맞추지 않은 표시점)
    lv.marker = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: COL.proton, transparent: true, depthWrite: false, depthTest: false }));
    lv.marker.scale.set(0.35, 0.35, 1); zoomRoot.add(lv.marker);
    lv.markerLabel = K.label("원자핵 위치(실제 핵은 이 점보다 훨씬 작음)", { height: 0.32, size: 40 });
    lv.markerLabel.position.set(0, -0.45, 0); zoomRoot.add(lv.markerLabel);
  })();

  // 원자핵: 양성자 8 + 중성자 8
  (function () {
    var lv = LV[3], rN = 0.15, shell = 0.34;
    var pMat = fadeable(new THREE.MeshPhongMaterial({ color: COL.proton, shininess: 50, emissive: 0x220606 })), nMat = fadeable(new THREE.MeshPhongMaterial({ color: COL.neutron, shininess: 50 }));
    var pMatC = fadeable(new THREE.MeshPhongMaterial({ color: COL.proton, shininess: 50, emissive: 0x220606 }));
    lv.mats.push(pMat, nMat); lv.pMatC = pMatC;
    var geo = new THREE.SphereGeometry(rN, 24, 16);
    lv.nucleons = [];
    var c = new THREE.Mesh(geo, pMatC); lv.group.add(c); lv.centerP = c;
    var n = 15, gold = Math.PI * (3 - Math.sqrt(5)), protons = 7;
    for (var i = 0; i < n; i++) {
      var y = 1 - (i + 0.5) / n * 2, rr = Math.sqrt(1 - y * y), th = gold * i;
      var isP = (i % 2 === 0) && protons-- > 0;
      var m = new THREE.Mesh(geo, isP ? pMat : nMat);
      m.position.set(Math.cos(th) * rr * shell, y * shell, Math.sin(th) * rr * shell);
      m.userData = { p0: m.position.clone(), ph: Math.random() * 6.28, w: 2 + Math.random() * 2 };
      lv.group.add(m); lv.nucleons.push(m);
    }
  })();

  // 양성자: 쿼크 3개 + 글루온
  (function () {
    var lv = LV[4];
    addMesh(lv, new THREE.SphereGeometry(0.5, 48, 24), new THREE.MeshPhongMaterial({ color: COL.proton, opacity: 0.16, depthWrite: false, side: THREE.DoubleSide }));
    addMesh(lv, new THREE.SphereGeometry(0.5, 24, 12), new THREE.MeshBasicMaterial({ color: COL.proton, wireframe: true, opacity: 0.12 }));
    var qGeo = new THREE.SphereGeometry(0.06, 20, 12);
    lv.quarks = [["u", COL.quark_u], ["u", COL.quark_u], ["d", COL.quark_d]].map(function (q, i) {
      var m = addMesh(lv, qGeo, new THREE.MeshPhongMaterial({ color: q[1], emissive: q[1], emissiveIntensity: 0.35 }));
      var lb = K.label(q[0], { height: 0.09, size: 48, color: "#ffffff" }); lb.position.set(0, 0.1, 0); m.add(lb); lv.mats.push(lb.material); fadeable(lb.material, 1);
      m.userData = { f: [0.9 + i * 0.23, 1.17 + i * 0.11, 0.73 + i * 0.31], ph: [i * 2.1, i * 1.3 + 0.5, i * 0.7 + 1.1] };
      return m;
    });
    var gMat = fadeable(new THREE.LineBasicMaterial({ color: COL.gluon, opacity: 0.95 })); lv.mats.push(gMat);
    lv.gluons = [[0, 1], [1, 2], [2, 0]].map(function (pr) {
      var g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(80 * 3), 3));
      var l = new THREE.Line(g, gMat); l.frustumCulled = false; lv.group.add(l); return { line: l, a: pr[0], b: pr[1] };
    });
    // 바다 쿼크(잠깐 생겼다 사라지는 쿼크–반쿼크 쌍)
    var sMat = fadeable(new THREE.MeshBasicMaterial({ color: 0xffd7a8, opacity: 0.8 })); lv.mats.push(sMat);
    lv.sea = [];
    for (var i = 0; i < 4; i++) {
      var a = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 6), sMat), b = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 6), sMat);
      lv.group.add(a); lv.group.add(b); lv.sea.push({ a: a, b: b, life: Math.random(), c: new THREE.Vector3(), d: new THREE.Vector3() });
    }
  })();

  var Z = { viewLog: -3, target: -3, min: -15.05, max: -2.7, visited: {}, tour: false, tourT: 0 };
  function setLevelAlpha(lv, a) {
    lv.group.visible = a > 0.003;
    lv.mats.forEach(function (m) { m.opacity = m.userData.base * a; if (m.userData.base >= 1) m.depthWrite = a > 0.97; });
  }
  function nearestLevel() {
    var best = 0, bd = 1e9;
    LV.forEach(function (lv, i) { var dd = Math.abs(lv.log - Z.viewLog); if (dd < bd) { bd = dd; best = i; } });
    return best;
  }
  function updateZoom(dt, t, real) {
    if (Z.tour) {
      Z.tourT += real;
      if (Z.tourT > 4.2) { Z.tourT = 0; var nx = (nearestLevel() + 1) % LV.length; Z.target = LV[nx].log; }
    }
    Z.viewLog += (Z.target - Z.viewLog) * Math.min(1, real * 2.6);
    if (Math.abs(Z.target - Z.viewLog) < 1e-4) Z.viewLog = Z.target;
    LV.forEach(function (lv) {
      var s = Math.pow(10, lv.log - Z.viewLog);
      var a = (lv.inB > 0 ? ramp(s, lv.inA, lv.inB) : 1) * (1 - ramp(s, lv.outA, lv.outB));
      lv.s = s; lv.alpha = a;
      setLevelAlpha(lv, a);
      if (a > 0.003) lv.group.scale.setScalar(4 * s);
    });
    // 단계별 세부 페이드
    var m = LV[1]; m.oMatC.opacity = m.alpha * (1 - ramp(m.s, 0.9, 1.5)); m.oMatC.depthWrite = m.oMatC.opacity > 0.97; m.center.children[0].visible = m.oMatC.opacity > 0.01;
    var nu = LV[3]; nu.pMatC.opacity = nu.alpha * (1 - ramp(LV[4].s, 0.3, 0.6)); nu.pMatC.depthWrite = nu.pMatC.opacity > 0.97; nu.centerP.visible = nu.pMatC.opacity > 0.01;
    var at = LV[2], showMarker = ramp(at.s, 0.5, 0.9) * (1 - ramp(LV[3].s, 0.01, 0.03));
    at.marker.visible = at.markerLabel.visible = showMarker > 0.05;
    at.marker.material.opacity = showMarker; at.markerLabel.material.opacity = showMarker;
    // 움직임
    LV[0].group.rotation.y = t * 0.25; if (LV[0].drop) LV[0].drop.scale.set(1 + 0.025 * Math.sin(t * 2.2), 1 - 0.02 * Math.sin(t * 2.2), 1);
    LV[1].center.rotation.y = t * 0.4;
    LV[1].others.forEach(function (o) { var u = o.userData; o.position.set(u.p0.x + 0.06 * Math.sin(t * u.w + u.ph), u.p0.y + 0.06 * Math.cos(t * u.w * 1.3 + u.ph), u.p0.z + 0.06 * Math.sin(t * u.w * 0.7)); o.rotation.x += u.rs[0] * dt; o.rotation.y += u.rs[1] * dt; });
    if (at.group.visible) { at.resample(90); at.group.rotation.y = t * 0.15; }
    LV[3].group.rotation.y = t * 0.2;
    LV[3].nucleons.forEach(function (o) { var u = o.userData; o.position.copy(u.p0).multiplyScalar(1 + 0.04 * Math.sin(t * u.w + u.ph)); });
    var P = LV[4];
    if (P.group.visible) {
      P.quarks.forEach(function (q) { var u = q.userData; q.position.set(0.26 * Math.sin(t * u.f[0] + u.ph[0]), 0.26 * Math.sin(t * u.f[1] + u.ph[1]), 0.26 * Math.sin(t * u.f[2] + u.ph[2])); });
      var tmp = new THREE.Vector3(), perp = new THREE.Vector3(), perp2 = new THREE.Vector3();
      P.gluons.forEach(function (gl) {
        var A = P.quarks[gl.a].position, B = P.quarks[gl.b].position, arr = gl.line.geometry.attributes.position.array;
        tmp.subVectors(B, A); perp.set(-tmp.y, tmp.x, 0.3).normalize(); perp2.crossVectors(tmp, perp).normalize();
        for (var i = 0; i < 80; i++) {
          var f = i / 79, ph = f * Math.PI * 2 * 7 - t * 9, amp = 0.022 * Math.sin(Math.PI * f);
          arr[3 * i] = A.x + tmp.x * f + amp * (perp.x * Math.cos(ph) + perp2.x * Math.sin(ph));
          arr[3 * i + 1] = A.y + tmp.y * f + amp * (perp.y * Math.cos(ph) + perp2.y * Math.sin(ph));
          arr[3 * i + 2] = A.z + tmp.z * f + amp * (perp.z * Math.cos(ph) + perp2.z * Math.sin(ph));
        }
        gl.line.geometry.attributes.position.needsUpdate = true;
      });

      roZ.set("size", lv.size.replace(/^약 /, "").replace(/ \(.*\)$/, ""));
      roZ.set("exp", String(lv.exp));
      roZ.set("ratio", i ? K.fmt(LV[i - 1].L / lv.L, 3) : "–");
      zDesc.textContent = lv.desc;
      sZoom.set(-Z.viewLog);
    } else if (mode === "gallery") {
      h1.innerHTML = selected
        ? '<span class="hud-line"><b>' + selected.n + " " + selected.s.replace("_", "") + '</b></span><span class="hud-line"><span class="k">질량</span> <span class="v">' + selected.m + '</span></span><span class="hud-line"><span class="k">전하</span> <span class="v">' + selected.q + ' e</span> · <span class="k">스핀</span> <span class="v">' + selected.spin + "</span></span>"
        : '<span class="hud-line"><b>표준모형의 기본 입자 17개</b></span><span class="hud-line"><span class="k">구를 눌러 정보를 보세요</span></span>';
      h2.innerHTML = '<span class="hud-line"><span class="k">구의 크기 = 질량(로그 눈금)</span></span><span class="hud-line"><span class="k">기본 입자는 크기가 측정되지 않음(10⁻¹⁸ m 이하)</span></span>';
    } else {
      h1.innerHTML = '<span class="hud-line"><span class="k">조합</span> <b>' + (puz.combo || "–") + '</b></span><span class="hud-line"><span class="k">전하</span> <span class="v">' + (puz.expr || "–") + "</span></span>";
      h2.innerHTML = '<span class="hud-line"><span class="k">색: 빨강 u · 파랑 d · 보라 s · 그물 무늬 = 반쿼크</span></span><span class="hud-line"><span class="k">초록 물결선 = 글루온</span></span>';
    }
  }
  function drawLadder() {
    if (mode !== "zoom" || zSec.hidden) return;
    var all = LV.map(function (lv, i) { return [i + 1, lv.log]; });
    var vis = LV.map(function (lv, i) { return Z.visited[i] ? [i + 1, lv.log] : null; }).filter(Boolean);
    K.plot.xy(cvL, { xr: [0.6, 5.4], yr: [-16, -2], xlabel: "단계 (1 물방울 → 5 양성자)", ylabel: "log₁₀(크기/m)", series: [
      { points: all, color: "#7880a0", line: true, dots: true, r: 3 },
      { points: vis, color: "#5fd08a", r: 4.5 },
      { points: [[0.6, Z.viewLog], [5.4, Z.viewLog]], color: "#f0a35e", line: true, dots: false, dash: [5, 4], width: 1.5 }
    ] });
  }
  window.addEventListener("resize", function () { setTimeout(drawLadder, 50); });

  /* ---------- 매 프레임 ---------- */
  var ladderTimer = 0;
  sim.onFrame(function (dt, t, real) {
    if (mode === "zoom") {
      updateZoom(dt, t, real);
      hudTimer += real; ladderTimer += real;
      if (hudTimer > 0.12) { hudTimer = 0; updateHud(); }
      if (ladderTimer > 0.2 && Math.abs(Z.target - Z.viewLog) > 1e-3) { ladderTimer = 0; drawLadder(); }
    } else if (mode === "gallery") {
      P17.forEach(function (p, i) { var m = p.mesh; m.position.y = m.userData.base.y + 0.06 * Math.sin(t * 1.3 + i); });
      if (selected) { selRing.position.y = selected.mesh.position.y; selRing.rotation.z = t; }
    } else updatePuzzle(t);
  });

  /* ---------- 시작 ---------- */
  setMode("zoom"); evaluate(); applyFilter(); drawLadder(); started = true;
})();
</script>
</body>
</html>
