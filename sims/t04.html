<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자기장 속 입자 궤적 모의실험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../assets/css/sim.css">
<style>
  /* 이 모의실험에서만 쓰는 작은 보조 스타일 (sim.css 색 변수 사용) */
  .hud .row { display: flex; gap: .3rem .8rem; flex-wrap: wrap; }
  .hud .ok { color: var(--s-ok); font-weight: 700; }
  .hud .bad { color: var(--s-bad); font-weight: 700; }
  .hud .warn { color: var(--s-warn); font-weight: 700; }
  .info { font-size: .85rem; color: var(--s-ink-2); background: var(--s-panel-2); border-radius: 7px; padding: .5rem .65rem; }
  .info b { color: var(--s-ink); font-family: var(--font-mono); font-weight: 600; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  @media (max-width: 560px) {
    .hud { font-size: .74rem; padding: .3rem .5rem; }
    .hud.opt { display: none; }
  }
</style>
</head>
<body>
<div class="sim">
  <header class="sim-head">
    <span class="tag">주제 4 · 3D</span>
    <h1>자기장 속 하전 입자 궤적</h1>
    <nav aria-label="관련 자료">
      <a href="../students/t04.html">학생용 활동지</a>
      <a href="../teachers/t04.html">교사용 지도서</a>
      <a href="index.html">모의실험 목록</a>
    </nav>
  </header>
  <div class="sim-body">
    <div class="stage" id="stage">
      <div class="stage-overlay" id="overlay">
        <div class="hud" id="hud-main"></div>
        <div class="hud" id="hud-meas"></div>
        <div class="hud opt" id="hud-scale"></div>
      </div>
      <div class="stage-hint">드래그: 회전 · 휠/두 손가락: 확대 · 오른쪽 드래그: 이동</div>
    </div>
    <aside class="panel" id="panel" aria-label="조작과 기록"></aside>
  </div>
</div>
<script src="../assets/vendor/three/three.min.js"></script>
<script src="../assets/vendor/three/OrbitControls.js"></script>
<script src="../assets/js/sim-kit.js"></script>
<script>
(function () {
  "use strict";
  var THREE = window.THREE, K = window.SimKit, ui = K.ui, fmt = K.fmt, C = K.C;
  var CL = C.c, E = C.e, MEV = C.MeV;
  var LAB_CAM = [[11, 10.5, 15.5], [0, 3.2, 0]];
  var RING_CAM = [[0, 10.5, 12.5], [0, 0.6, 0]];
  var sim = K.create({ stage: document.getElementById("stage"), cameraPos: LAB_CAM[0], target: LAB_CAM[1] });
  var panel = document.getElementById("panel");
  var mode = "lab";

  function lenText(m) {
    if (!isFinite(m)) return "∞";
    var a = Math.abs(m);
    if (a >= 1000) return fmt(m / 1000, 4) + " km";
    if (a >= 1) return fmt(m, 4) + " m";
    if (a >= 0.01) return fmt(m * 100, 4) + " cm";
    if (a >= 1e-3) return fmt(m * 1000, 4) + " mm";
    return fmt(m * 1e6, 4) + " μm";
  }
  function timeText(s) {
    if (!isFinite(s)) return "–";
    if (s >= 1e-3) return fmt(s * 1e3, 4) + " ms";
    if (s >= 1e-6) return fmt(s * 1e6, 4) + " μs";
    return fmt(s * 1e9, 4) + " ns";
  }
  function niceUnit(v) {
    var e = Math.floor(Math.log10(v)), f = v / Math.pow(10, e);
    var n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10;
    return n * Math.pow(10, e);
  }

  /* ======================= 미션 ======================= */
  var mission = K.Mission(ui.section(panel, "미션"), { id: "t04", steps: [
    "<b>r ∝ v</b> — 같은 입자·같은 B, 입사각 0°에서 속력 v만 3가지 이상 바꿔 [기록]하세요. r–v 그래프가 원점을 지나는 직선인가요?",
    "<b>r ∝ 1/B</b> — 같은 입자·같은 속력에서 B만 3가지 이상 바꿔 [기록]하세요. r–1/B 그래프를 확인하세요.",
    "<b>전자 vs 양성자</b> — 같은 v·같은 B에서 전자와 양성자를 각각 [기록]하세요. 반지름은 몇 배이고 도는 방향은 어떤가요?",
    "<b>나선 운동</b> — 입사각을 10° 이상으로 바꿔, 입자가 자기장 속에서 나선을 한 바퀴 이상 그리게 하세요.",
    "<b>LHC 자석 세기</b> — [싱크로트론 링] 모드의 LHC에서 B₀·B₁을 p = 0.3·B·r로 직접 계산해 넣고, 450 GeV → 6.8 TeV 램프를 빔 손실 없이 끝내세요."
  ] });

  var modeSec = ui.section(panel, "모드");
  var modeSel = ui.select(modeSec, { id: "mode", label: "실험 모드", value: "lab", options: [
    { value: "lab", label: "균일 자기장 실험실 (원운동·나선 운동)" },
    { value: "ring", label: "싱크로트론 링 (B 램프 맞추기)" }
  ], onChange: setMode });
  ui.slider(modeSec, { id: "speed", label: "재생 속도", min: 0.25, max: 3, step: 0.25, value: 1, unit: "배",
    format: function (v) { return v.toFixed(2); }, onInput: function (v) { sim.timeScale = v; } });

  /* ======================= 실험실 모드: 패널 ======================= */
  var PRE = {
    electron: { name: "전자", q: -1, m: C.me_MeV, color: K.COLORS.electron },
    muon: { name: "뮤온 μ⁻", q: -1, m: C.mmu_MeV, color: K.COLORS.muon },
    proton: { name: "양성자", q: 1, m: C.mp_MeV, color: K.COLORS.proton },
    alpha: { name: "알파 입자", q: 2, m: 3727.379, color: K.COLORS.alpha },
    custom: { name: "사용자 정의", color: K.COLORS.track }
  };
  var labSecs = [];
  var cSec = ui.section(panel, "입자와 자기장"); labSecs.push(cSec);
  var partSel = ui.select(cSec, { id: "part", label: "입자", value: "proton", options: [
    { value: "electron", label: "전자 (q = −1e, 0.511 MeV/c²)" },
    { value: "muon", label: "뮤온 μ⁻ (q = −1e, 105.66 MeV/c²)" },
    { value: "proton", label: "양성자 (q = +1e, 938.27 MeV/c²)" },
    { value: "alpha", label: "알파 입자 (q = +2e, 3727.4 MeV/c²)" },
    { value: "custom", label: "사용자 정의 (q·m 직접 조절)" }
  ], onChange: function (v) { if (v !== "custom") { qS.set(PRE[v].q); mS.set(Math.log10(PRE[v].m)); } else mS.refresh(); relaunchSoon(0); } });
  var qS = ui.slider(cSec, { id: "q", label: "전하 q", min: -2, max: 2, step: 1, value: 1, unit: "e",
    format: function (v) { return (v > 0 ? "+" : "") + Math.round(v); }, onInput: function () { partSel.set("custom"); mS.refresh(); relaunchSoon(); } });
  var mS = ui.slider(cSec, { id: "mass", label: "질량 m (로그 눈금)", min: -0.5, max: 3.7, step: 0.001, value: Math.log10(C.mp_MeV), unit: "MeV/c²",
    format: function (v) { var k = partSel && partSel.get(); return fmt(k && k !== "custom" ? PRE[k].m : Math.pow(10, v), 5); }, onInput: function () { partSel.set("custom"); mS.refresh(); relaunchSoon(); } });
  var vS = ui.slider(cSec, { id: "vel", label: "속력 v", min: 1, max: 299, step: 1, value: 10, unit: "×10⁶ m/s",
    format: function (v) { return String(Math.round(v)); }, onInput: function () { relaunchSoon(); } });
  var BS = ui.slider(cSec, { id: "bfield", label: "자기장 B", min: 0.01, max: 3, step: 0.01, value: 0.5, unit: "T",
    format: function (v) { return v.toFixed(2); }, onInput: function () { relaunchSoon(); } });
  var aS = ui.slider(cSec, { id: "angle", label: "입사각 (B에 수직인 면 기준)", min: 0, max: 80, step: 1, value: 0, unit: "°",
    format: function (v) { return String(Math.round(v)); }, onInput: function () { relaunchSoon(); } });
  var flipT = ui.toggle(cSec, { id: "flip", label: "B 방향을 아래로 뒤집기 (기본: 위)", onChange: function () { relaunchSoon(0); } });
  var rowA = ui.buttonRow(cSec);
  ui.button(rowA, { label: "다시 발사", kind: "primary", onClick: function () { launch(); } });
  ui.button(rowA, { label: "일시정지/재생", onClick: function () { sim.toggle(); } });
  ui.button(rowA, { label: "위에서 보기", onClick: function () { sim.setView([0, 17, 0.01], [0, 0.8, 0]); } });
  ui.button(rowA, { label: "시점 초기화", onClick: function () { var lc = camFor(LAB_CAM); sim.setView(lc[0], lc[1]); } });
  var arrowT = ui.toggle(cSec, { id: "arrows", label: "속도(v)·힘(F) 화살표", checked: true });
  var circT = ui.toggle(cSec, { id: "circ", label: "이론 궤도 원 r = p/(|q|B) 표시", checked: true, onChange: function (v) { theoryLine.visible = v && mode === "lab"; } });
  var autoScaleT = ui.toggle(cSec, { id: "autoscale", label: "자동 축척 (끄면 화면 축척 고정 → 크기 비교)", checked: true });
  var repeatT = ui.toggle(cSec, { id: "repeat", label: "영역을 벗어나면 자동으로 다시 발사", checked: true });

  var roSec = ui.section(panel, "측정값"); labSecs.push(roSec);
  var ro = ui.readouts(roSec, [
    { key: "p", label: "운동량 p = γmv", unit: "MeV/c" }, { key: "g", label: "로런츠 인자 γ", unit: "" },
    { key: "ek", label: "운동에너지 Eₖ", unit: "MeV" }, { key: "F", label: "자기력 F = |q|v⊥B", unit: "N" },
    { key: "rt", label: "이론 r = p⊥/(|q|B)", unit: "" }, { key: "rm", label: "측정 r (궤적 맞춤)", unit: "" },
    { key: "err", label: "측정–이론 차이", unit: "%" }, { key: "rc", label: "고전 r = mv⊥/(|q|B)", unit: "" },
    { key: "T", label: "주기 T (측정)", unit: "" }, { key: "pitch", label: "나선 피치 (측정)", unit: "" }
  ]);

  var gSec = ui.section(panel, "그래프 (기록표 자료)"); labSecs.push(gSec);
  var gSel = ui.select(gSec, { id: "graph", label: "보기", value: "rv", options: [
    { value: "rv", label: "r – v (지금 입자, 지금 B)" },
    { value: "rb", label: "r – 1/B (지금 입자, 지금 v)" },
    { value: "rp", label: "r – p (지금 B, 같은 |q|의 모든 입자)" }
  ], onChange: drawLabGraph });
  var cv1 = document.createElement("canvas"); cv1.className = "plot plot--tall"; cv1.setAttribute("aria-label", "반지름 그래프"); gSec.appendChild(cv1);
  var leg1 = ui.html(gSec, "", "legend");

  var recSec = ui.section(panel, "기록표", "반 바퀴 이상 돈 뒤 [기록]을 누르면 측정 반지름이 저장됩니다."); labSecs.push(recSec);
  ui.button(recSec, { label: "기록", kind: "primary", onClick: recordLab });
  var rec = K.Recorder(recSec, { id: "t04-lab", columns: [
    { key: "part", label: "입자" }, { key: "q", label: "q", unit: "e" }, { key: "m", label: "m", unit: "MeV/c²" },
    { key: "v", label: "v", unit: "10⁶ m/s" }, { key: "B", label: "B", unit: "T" }, { key: "ang", label: "각도", unit: "°" },
    { key: "rm", label: "측정 r", unit: "m" }, { key: "rt", label: "이론 r", unit: "m" }, { key: "err", label: "차이", unit: "%" },
    { key: "T", label: "주기", unit: "s" }
  ], onChange: function (rows) { checkLabMissions(rows); drawLabGraph(); } });

  /* ======================= 링 모드: 패널 ======================= */
  var RINGS = {
    lhc: { name: "LHC", R: 2804, C: 26659, p0: 450, p1: 6800, note: "450 GeV → 6.8 TeV (Run 3)" },
    sps: { name: "SPS", R: 741.3, C: 6911, p0: 26, p1: 450, note: "26 GeV/c → 450 GeV/c" },
    ps: { name: "PS", R: 70.08, C: 628.3, p0: 2.784, p1: 26, note: "2.78 GeV/c(운동에너지 2 GeV) → 26 GeV/c" }
  };
  var TOL = 0.02, EXAG = 5, RD = 6, RING_Y = 1.0, RAMP_REAL = 15;
  var ringSecs = [];
  var rSec = ui.section(panel, "싱크로트론 링", "링 반지름 R은 고정입니다. 빔의 운동량 p가 커지는 만큼 B도 함께 올려야 궤도 반지름 r = p/(0.3·B)가 R에 머뭅니다. 단위: p [GeV/c], B [T], r [m]."); ringSecs.push(rSec);
  var ringSel = ui.select(rSec, { id: "ring", label: "링 선택", value: "lhc", options: [
    { value: "lhc", label: "LHC — 휨 반지름 R = 2804 m" },
    { value: "sps", label: "SPS — 휨 반지름 R = 741.3 m" },
    { value: "ps", label: "PS — 휨 반지름 R = 70.08 m" }
  ], onChange: function () { buildRing(); resetRing(); } });
  var ringInfo = ui.html(rSec, "", "info");
  function numInput(parent, id, label, value) {
    var d = ui.html(parent, '<label class="ctl-row" for="' + id + '"><span>' + label + '</span><span class="val">T</span></label>' +
      '<input type="number" id="' + id + '" step="0.001" min="0" max="20" value="' + value + '" inputmode="decimal">', "ctl");
    var inp = d.querySelector("input");
    inp.addEventListener("input", function () { autoUsed = false; resetRing(); });
    return inp;
  }
  var twoB = ui.html(rSec, "", "two");
  var B0In = numInput(twoB, "b0", "주입 때 B₀", "0.500");
  var B1In = numInput(twoB, "b1", "최고 에너지 B₁", "5.000");
  var rowR = ui.buttonRow(rSec);
  ui.button(rowR, { label: "램프 시작", kind: "primary", onClick: startRamp });
  ui.button(rowR, { label: "처음으로(다시 주입)", onClick: function () { resetRing(); } });
  ui.button(rowR, { label: "시점 초기화", onClick: function () { var rc = camFor(RING_CAM); sim.setView(rc[0], rc[1]); } });
  ui.button(rowR, { label: "자동 설정(시연용)", kind: "warn", onClick: function () {
    var R = RINGS[ringSel.get()];
    B0In.value = (R.p0 / (0.299792458 * R.R)).toFixed(3); B1In.value = (R.p1 / (0.299792458 * R.R)).toFixed(3);
    resetRing(); autoUsed = true;
    K.toast("시연용 자동 설정입니다. 이 값으로 성공해도 미션은 인정되지 않아요.");
  } });
  var rRoSec = ui.section(panel, "링 측정값"); ringSecs.push(rRoSec);
  var rro = ui.readouts(rRoSec, [
    { key: "p", label: "빔 운동량 p", unit: "GeV/c" }, { key: "breq", label: "필요한 B = p/(0.3R)", unit: "T" },
    { key: "b", label: "지금 B", unit: "T" }, { key: "r", label: "궤도 반지름 r", unit: "m" },
    { key: "dev", label: "편차 (r−R)/R", unit: "%" }, { key: "prog", label: "램프 진행", unit: "%" }
  ]);
  var gSec2 = ui.section(panel, "그래프: 자기장 – 운동량"); ringSecs.push(gSec2);
  var cv2 = document.createElement("canvas"); cv2.className = "plot plot--tall"; cv2.setAttribute("aria-label", "자기장-운동량 그래프"); gSec2.appendChild(cv2);
  ui.html(gSec2, "초록 점선: 빔이 링 반지름을 유지하는 B = p/(0.3R). 주황: 실제로 올린 B.", "legend");
  var recSec2 = ui.section(panel, "기록표 (램프)", "램프가 끝나거나 빔을 잃으면 [기록]을 누르세요."); ringSecs.push(recSec2);
  ui.button(recSec2, { label: "기록 (램프 결과)", kind: "primary", onClick: recordRing });
  var rec2 = K.Recorder(recSec2, { id: "t04-ring", columns: [
    { key: "ring", label: "링" }, { key: "p0", label: "입사 p", unit: "GeV/c" }, { key: "p1", label: "목표 p", unit: "GeV/c" },
    { key: "B0", label: "B₀", unit: "T" }, { key: "B1", label: "B₁", unit: "T" }, { key: "res", label: "결과" },
    { key: "pl", label: "손실 지점 p", unit: "GeV/c" }
  ] });

  /* ======================= 실험실 모드: 장면 ======================= */
  var labG = new THREE.Group(); sim.scene.add(labG);
  var BOX = { x: 5, z: 5, y0: 0, y1: 8 };
  var Y_START = 0.8;
  (function () {
    var edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(10, 8, 10)), new THREE.LineBasicMaterial({ color: 0x3a4670 }));
    edges.position.set(0, 4, 0); labG.add(edges);
    var floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshBasicMaterial({ color: 0x7f9cff, transparent: true, opacity: 0.04, side: THREE.DoubleSide, depthWrite: false }));
    floor.rotation.x = -Math.PI / 2; floor.position.y = 0.01; labG.add(floor);
  })();
  var fieldArrows = [];
  [-3.75, -1.25, 1.25, 3.75].forEach(function (x) {
    [-3.75, -1.25, 1.25, 3.75].forEach(function (z) {
      var a = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(x, 0.2, z), 7.6, K.COLORS.field, 0.45, 0.22);
      a.line.material.transparent = true; a.line.material.opacity = 0.22;
      a.cone.material.transparent = true; a.cone.material.opacity = 0.5;
      labG.add(a); fieldArrows.push(a);
    });
  });
  var bLabel = K.label("B (위 방향)", { height: 0.5, color: "#a9b8ff" }); bLabel.position.set(-3.75, 8.6, -3.75); labG.add(bLabel);

  var trail = K.Trail(labG, { max: 5000, color: PRE.proton.color });
  var dot = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), new THREE.MeshBasicMaterial({ color: PRE.proton.color }));
  labG.add(dot);
  var gun = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.2, 0.8, 16), new THREE.MeshStandardMaterial({ color: 0x8a93b3, metalness: 0.4, roughness: 0.5 }));
  labG.add(gun);
  var vArrow = K.arrow(new THREE.Vector3(), new THREE.Vector3(1, 0, 0), 1.4, 0xe6e9f4); labG.add(vArrow);
  var fArrow = K.arrow(new THREE.Vector3(), new THREE.Vector3(0, 0, 1), 1.4, 0xf0a35e); labG.add(fArrow);
  var vLab = K.label("v", { height: 0.45, bg: false, color: "#e6e9f4" }); labG.add(vLab);
  var fLab = K.label("F", { height: 0.45, bg: false, color: "#f0a35e" }); labG.add(fLab);
  var theoryPos = new Float32Array(129 * 3);
  var theoryGeo = new THREE.BufferGeometry(); theoryGeo.setAttribute("position", new THREE.BufferAttribute(theoryPos, 3));
  var theoryLine = new THREE.Line(theoryGeo, new THREE.LineDashedMaterial({ color: 0x5fd08a, dashSize: 0.25, gapSize: 0.15 }));
  theoryLine.frustumCulled = false; labG.add(theoryLine);

  /* ======================= 실험실 모드: 물리 =======================
     균일한 B = (0, ±B, 0) 영역(화면의 상자) 안에서 상대론적 로렌츠 힘을 보리스(Boris) 회전법으로 적분.
     자기력만 있으면 |v|와 γ가 일정하므로 속도 벡터를 정확히 '회전'시켜 원이 나선형으로 퍼지지 않는다. */
  var L = null;            // 현재 발사 상태
  var scale = 1;           // 화면 단위 / m
  var scaleInit = false;

  function labParams() {
    var q = Math.round(qS.get()), m = Math.pow(10, mS.get()), key = partSel.get();
    if (key !== "custom") { q = PRE[key].q; m = PRE[key].m; }

    ringParts.bunches.forEach(function (b) { b.visible = true; b.material.color.set(K.COLORS.proton); b.material.opacity = 1; });
    ringTrail.clear(); burst.material.opacity = 0;
    if (Math.abs(RS.dev) > TOL) { RS.phase = "lost"; RS.lossP = RS.p; RS.lossT = 0; RS.injectFail = true; } else RS.injectFail = false;
    updateRingUi(); drawRingGraph();
  }
  function startRamp() {
    if (RS.phase === "ramp") return;
    if (RS.phase !== "inject") {
      resetRing();
      if (RS.phase !== "inject") { K.toast("주입부터 실패했어요. 주입 때 B₀를 다시 계산해 보세요."); return; }
    }
    RS.phase = "ramp"; RS.u = 0; RS.trace = [[RS.p, RS.B]];
    K.toast("램프 시작! 빔 에너지와 자기장이 함께 올라갑니다.");
  }
  function ringFrame(dt, real) {
    var R = RINGS[ringSel.get()];
    var B0 = readB(B0In), B1 = readB(B1In);
    if (RS.phase === "ramp") {
      RS.u = Math.min(1, RS.u + dt / RAMP_REAL);
      RS.p = R.p0 + (R.p1 - R.p0) * RS.u;
      RS.B = B0 + (B1 - B0) * RS.u;
      RS.dev = rOf(RS.p, RS.B) / R.R - 1;
      var lp = RS.trace[RS.trace.length - 1];
      if (!lp || RS.p - lp[0] > (R.p1 - R.p0) / 120) RS.trace.push([RS.p, RS.B]);
      if (Math.abs(RS.dev) > TOL || !isFinite(RS.dev)) {
        RS.phase = "lost"; RS.lossP = RS.p; RS.lossT = 0; RS.injectFail = false; RS.burstSet = false;
        RS.lastResult = { res: "빔 손실", pl: RS.p };
        K.toast("빔이 벽에 부딪혔어요! p = " + fmt(RS.p, 4) + " GeV/c에서 B가 " + (RS.dev > 0 ? "부족" : "과다") + "했어요.");
      } else if (RS.u >= 1) {
        RS.phase = "top";
        RS.lastResult = { res: "성공", pl: "–" };
        if (ringSel.get() === "lhc" && !autoUsed) mission.complete(4, "미션 5 완료! 6.8 TeV 양성자를 반지름 2.8 km로 휘려면 약 8.1 T가 필요해요.");
        else K.toast(R.name + " 램프 성공! " + (autoUsed ? "(자동 설정은 미션에 포함되지 않아요)" : ""));
      }
      drawRingGraph();
    } else if (RS.phase === "inject") {
      RS.p = R.p0; RS.B = B0; RS.dev = rOf(RS.p, RS.B) / R.R - 1;
    }
    // 화면 표시: 반지름 편차를 EXAG배 과장
    var target = Math.max(-0.3, Math.min(0.3, RS.dev)) * EXAG;
    if (RS.phase === "lost") {
      RS.lossT += real;
      var dirn = RS.dev >= 0 ? 1 : -1;
      RS.devShow = dirn * (TOL * EXAG + Math.min(RS.lossT, 0.5) * 0.12);
      var fade = Math.max(0, 1 - RS.lossT / 0.7);
      ringParts.bunches.forEach(function (b) { b.material.color.set(0xff7a6b); b.material.opacity = fade; b.visible = fade > 0; });
      burst.material.opacity = Math.max(0, 0.8 - RS.lossT * 0.8);
      burst.scale.setScalar(1 + Math.min(RS.lossT, 1) * 2.5);
      if (RS.injectFail && RS.lossT > 1.6) { resetRing(); }
    } else RS.devShow += (target - RS.devShow) * Math.min(1, real * 8);
    if (RS.phase !== "lost" || RS.lossT < 0.7) RS.ang += real * 2 * Math.PI * 0.32 * (sim.running ? 1 : 0);
    var rd = RD * (1 + RS.devShow);
    ringParts.bunches.forEach(function (b, i) {
      var t = RS.ang + i / ringParts.bunches.length * Math.PI * 2;
      b.position.set(rd * Math.cos(t), RING_Y, rd * Math.sin(t));
    });
    var lead = ringParts.bunches[0].position;
    if (RS.phase !== "lost") ringTrail.push(lead.clone());
    else if (!RS.burstSet) { RS.burstSet = true; var bf = 1 + (RS.dev >= 0 ? 1 : -1) * TOL * EXAG; burst.position.set(RD * bf * Math.cos(RS.ang), RING_Y, RD * bf * Math.sin(RS.ang)); }
    var Bmax = RINGS[ringSel.get()].p1 / (0.299792458 * R.R);
    var bri = Math.min(1.2, RS.B / Bmax);
    ringParts.magnets.forEach(function (m) { m.emissiveIntensity = 0.05 + 0.6 * bri; });
    ringTick += real;
    if (ringTick > 0.15) { ringTick = 0; updateRingUi(); }
  }
  var ringTick = 0;

  function updateRingUi() {
    var R = RINGS[ringSel.get()];
    var r = rOf(RS.p, RS.B), breq = RS.p / (0.299792458 * R.R);
    rro.set("p", RS.p, 4); rro.set("breq", breq.toFixed(3)); rro.set("b", RS.B.toFixed(3));
    rro.set("r", isFinite(r) ? fmt(r, 4) : "∞"); rro.set("dev", isFinite(RS.dev) ? (RS.dev * 100).toFixed(2) : "∞");
    rro.set("prog", (RS.u * 100).toFixed(0));
    var st;
    if (RS.phase === "inject") st = '<span class="ok">주입 성공 — 빔이 돌고 있어요. [램프 시작]을 누르세요.</span>';
    else if (RS.phase === "ramp") st = Math.abs(RS.dev) > TOL * 0.6 ? '<span class="warn">경고: 궤도가 벽 쪽으로 밀려나요!</span>' : '<span class="ok">램프 중 — 궤도 유지</span>';
    else if (RS.phase === "top") st = '<span class="ok">최고 에너지 도달! 램프 성공</span>';
    else st = RS.injectFail ? '<span class="bad">주입 실패: B₀가 맞지 않아 빔이 벽에 부딪힘</span>' : '<span class="bad">빔 손실: p = ' + fmt(RS.lossP, 4) + ' GeV/c에서 벽에 충돌</span>';
    document.getElementById("hud-main").innerHTML = '<div>' + st + '</div>' +
      '<div class="row"><span><span class="k">p</span> <span class="v">' + fmt(RS.p, 4) + ' GeV/c</span></span>' +
      '<span><span class="k">B</span> <span class="v">' + RS.B.toFixed(3) + ' T</span></span>' +
      '<span><span class="k">필요한 B</span> <span class="v">' + breq.toFixed(3) + ' T</span></span></div>';
    document.getElementById("hud-meas").innerHTML =
      '<div><span class="k">궤도 반지름 r</span> <span class="v">' + (isFinite(r) ? fmt(r, 5) : "∞") + ' m</span></div>' +
      '<div><span class="k">링 R</span> <span class="v">' + fmt(R.R, 4) + ' m</span> <span class="k">· 편차</span> <span class="v">' + (isFinite(RS.dev) ? (RS.dev * 100).toFixed(2) : "∞") + ' %</span></div>';
    document.getElementById("hud-scale").innerHTML =
      '<div><span class="k">화면 축척</span> <span class="v">1칸(격자) ≈ ' + fmt(R.R / RD, 3) + ' m</span></div>' +
      '<div class="k">궤도 반지름의 차이는 ' + EXAG + '배로 과장 · 빔관 폭 ±' + (TOL * 100) + '%는 실제보다 훨씬 넓음</div>' +
      '<div class="k">실제로는 1초에 약 ' + fmt(CL / R.C, 4) + '바퀴 (화면은 아주 느리게)</div>';
  }
  function drawRingGraph() {
    if (mode !== "ring") return;
    var R = RINGS[ringSel.get()], k = 1 / (0.299792458 * R.R);
    var xmax = R.p1 * 1.05;
    var ideal = [[0, 0], [xmax, xmax * k]];
    var series = [{ points: ideal, color: "#5fd08a", line: true, dots: false, dash: [5, 4], width: 1.5, label: "필요한 B = p/(0.3R)" }];
    var plan = [[R.p0, readB(B0In)], [R.p1, readB(B1In)]];
    series.push({ points: plan, color: "#7880a0", line: true, dots: true, r: 2.5, width: 1, dash: [2, 3], label: "내 계획 (B₀→B₁)" });
    if (RS.trace.length) series.push({ points: RS.trace, color: "#f0a35e", line: true, dots: false, width: 2.5, label: "실제 램프" });
    var ymax = Math.max(xmax * k, readB(B0In), readB(B1In)) * 1.45;
    K.plot.xy(cv2, { series: series, xr: [0, xmax], yr: [0, ymax], xlabel: "빔 운동량 p (GeV/c)", ylabel: "B (T)" });
  }
  function recordRing() {
    var R = RINGS[ringSel.get()];
    if (!RS.lastResult && RS.phase !== "lost") { K.toast("램프를 먼저 실행하세요."); return; }
    var res = RS.phase === "lost" ? (RS.injectFail ? "주입 실패" : "빔 손실") : RS.lastResult.res;
    rec2.add({ ring: R.name, p0: R.p0, p1: R.p1, B0: readB(B0In), B1: readB(B1In), res: res,
      pl: RS.phase === "lost" ? Number(RS.lossP.toPrecision(4)) : "–" });
  }

  /* ======================= 모드 전환 ======================= */
  function camFor(c) {
    var st = sim.stage, asp = (st.clientWidth || 300) / (st.clientHeight || 300);
    var k = asp < 1.25 ? Math.pow(1.25 / asp, 0.75) : 1;
    var p = c[0], t = c[1];
    return [[t[0] + (p[0] - t[0]) * k, t[1] + (p[1] - t[1]) * k, t[2] + (p[2] - t[2]) * k], t];
  }
  function setMode(m) {
    mode = m;
    labG.visible = m === "lab"; ringG.visible = m === "ring";
    labSecs.forEach(function (s) { s.hidden = m !== "lab"; });
    ringSecs.forEach(function (s) { s.hidden = m !== "ring"; });
    if (m === "lab") { var lc = camFor(LAB_CAM); sim.setView(lc[0], lc[1]); launch(); drawLabGraph(); }
    else { var rc = camFor(RING_CAM); sim.setView(rc[0], rc[1]); buildRing(); resetRing(); }
  }

  sim.onFrame(function (dt, t, real) {
    if (mode === "lab") labFrame(dt, real); else ringFrame(dt, real);
  });

  setMode("lab");
  checkLabMissions(rec.rows);
  window.addEventListener("resize", function () { if (mode === "lab") drawLabGraph(); else drawRingGraph(); });
})();
</script>
</body>
</html>
