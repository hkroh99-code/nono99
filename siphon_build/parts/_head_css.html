<!-- ═══ [엔진] 디자인 시스템 CSS — 패밀리 룩의 핵심. 클래스 이름을 바꾸지 마세요 ═══ -->
<style>
:root{
  --bg:#0b1120; --bg2:#0f172a; --panel:#16203a; --panel2:#1c2942; --panel3:#233250;
  --bd:#2f4162; --bd2:#3d5480;
  --tx:#e6edf7; --mut:#9db0cc; --dim:#7288ab;
  --cy:#38bdf8; --vi:#a78bfa; --gr:#34d399; --am:#fbbf24; --rd:#fb7185; --pk:#f472b6;
  --shadow:0 8px 26px rgba(0,0,0,.42);
  --cvbg:#070c18;
  --tx2:#cfe0f5; --goalTx:#bfe9ff; --viTx:#d3c4ff; --amTx:#ffe8b0;
  --okTx:#9ff0c8; --rdTx:#ffb3c1; --softTx:#cbd9ea;
}
*,*::before,*::after{box-sizing:border-box;}
html.appdoc{ -webkit-text-size-adjust:100%; }
html.appdoc, html.appdoc body{
  margin:0; padding:0; max-width:100%; overflow-x:hidden;
  background:var(--bg); color:var(--tx);
  font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.65;
}
html.appdoc body{ background-image:radial-gradient(1200px 600px at 12% -8%, #1b2c50 0%, transparent 62%), radial-gradient(1000px 520px at 92% 4%, #241d4d 0%, transparent 60%); background-attachment:fixed; }
img,canvas,svg{max-width:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
a{color:var(--cy);}

.wrap{ width:100%; max-width:1440px; margin:0 auto; padding:0 14px 56px; }

/* ---------- 헤더 ---------- */
.hdr{ position:sticky; top:0; z-index:50; backdrop-filter:blur(10px);
  background:rgba(11,17,32,.9); border-bottom:1px solid var(--bd); }
.hdr-in{ width:100%; max-width:1440px; margin:0 auto; padding:10px 14px 0; }
.brandrow{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; }
.brand{ font-size:1.05rem; font-weight:800; letter-spacing:-.2px; margin:0;
  background:linear-gradient(92deg,var(--cy),var(--vi) 60%,var(--pk));
  -webkit-background-clip:text; background-clip:text; color:transparent; }
.brand-sub{ font-size:.73rem; color:var(--dim); }
.spacer{ flex:1 1 auto; }

.levelbar{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.levelbar .lb{ font-size:.7rem; color:var(--dim); margin-right:2px;}
.lv-pill{ border:1px solid var(--bd2); background:var(--panel); color:var(--mut);
  border-radius:999px; padding:3px 11px; font-size:.74rem; cursor:pointer; transition:.16s; }
.lv-pill:hover{ border-color:var(--cy); color:var(--tx); }
.lv-pill[aria-pressed="true"]{ background:linear-gradient(92deg,#0e3a56,#2b2160); border-color:var(--cy); color:#fff; font-weight:700; }

.tabbar{ display:flex; gap:6px; overflow-x:auto; overflow-y:hidden; padding:9px 0 8px;
  scrollbar-width:thin; -webkit-overflow-scrolling:touch; }
.tabbar::-webkit-scrollbar{height:6px;} .tabbar::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:9px;}
.tabbtn{ flex:0 0 auto; white-space:nowrap; border:1px solid var(--bd); background:var(--panel);
  color:var(--mut); border-radius:11px; padding:7px 12px; font-size:.79rem; cursor:pointer; transition:.16s; }
.tabbtn:hover{ border-color:var(--bd2); color:var(--tx); background:var(--panel2); }
.tabbtn[aria-selected="true"]{ background:linear-gradient(94deg,#0d3b58,#2a2062); border-color:var(--cy);
  color:#fff; font-weight:700; box-shadow:0 0 0 1px rgba(56,189,248,.28) inset; }
.tabbtn:focus-visible,.btn:focus-visible,.opt:focus-visible,.lv-pill:focus-visible,.tl-card:focus-visible{ outline:2px solid var(--cy); outline-offset:2px; }

/* ---------- 패널/카드 ---------- */
.panel{ display:none; padding-top:15px; }
.panel.on{ display:block; animation:fade .28s ease; }
@keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

.card{ background:linear-gradient(180deg,var(--panel),var(--bg2)); border:1px solid var(--bd);
  border-radius:14px; padding:14px 15px; margin-bottom:13px; box-shadow:var(--shadow); min-width:0; }
.card.tight{ padding:11px 12px; }
.h2{ font-size:1.15rem; font-weight:800; margin:0 0 4px; letter-spacing:-.2px; }
.h3{ font-size:.93rem; font-weight:700; margin:0 0 7px; color:var(--tx2); display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
.h4{ font-size:.82rem; font-weight:700; color:var(--cy); margin:12px 0 5px; }
.muted{ color:var(--mut); font-size:.84rem; }
.tiny{ color:var(--dim); font-size:.75rem; }
p{ margin:.42em 0; }
ul.bul{ margin:.35em 0; padding-left:1.15em; } ul.bul li{ margin:.2em 0; }

.goal{ font-size:.84rem; color:var(--goalTx); background:rgba(56,189,248,.09);
  border-left:3px solid var(--cy); border-radius:0 8px 8px 0; padding:7px 11px; margin:8px 0 0; }

.badge{ display:inline-block; font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:999px;
  border:1px solid; letter-spacing:.2px; vertical-align:middle;}
.b-mid{ color:#7ee0a8; border-color:#2b6b48; background:rgba(52,211,153,.12); }
.b-high{ color:#8fd2ff; border-color:#245c86; background:rgba(56,189,248,.12); }
.b-uni{ color:#c9b6ff; border-color:#4a3a86; background:rgba(167,139,250,.13); }
.b-poe{ color:#fcd77f; border-color:#7a5c17; background:rgba(251,191,36,.12); }
.b-exp{ color:#ffb0bf; border-color:#7d3446; background:rgba(251,113,133,.12); }

/* ---------- 2단 레이아웃 ---------- */
.grid2{ display:grid; grid-template-columns:minmax(0,395px) minmax(0,1fr); gap:13px; align-items:start; }
.grid2 > *{ min-width:0; }
@media (max-width:1080px){ .grid2{ grid-template-columns:minmax(0,1fr); } }

/* ---------- 컨트롤 ---------- */
.ctrl{ margin:9px 0; }
.ctrl-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:.8rem; }
.ctrl-top .nm{ color:var(--tx2); font-weight:600; }
.ctrl-top .vl{ color:var(--cy); font-variant-numeric:tabular-nums; font-weight:700; }
input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:5px; border-radius:5px;
  background:linear-gradient(90deg,var(--cy),var(--vi)); outline:none; margin:7px 0 0; cursor:pointer;
  touch-action:pan-y; }   /* 세로 스크롤은 그대로, 가로 드래그는 슬라이더가 받는다(휴대폰) */
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:17px; height:17px; border-radius:50%;
  background:#eaf6ff; border:2px solid var(--cy); cursor:pointer; box-shadow:0 0 8px rgba(56,189,248,.6); }
input[type=range]::-moz-range-thumb{ width:15px; height:15px; border-radius:50%; background:#eaf6ff;
  border:2px solid var(--cy); cursor:pointer; }
select,input[type=number],input[type=text]{ background:var(--panel2); border:1px solid var(--bd);
  color:var(--tx); border-radius:8px; padding:5px 9px; font-size:.82rem; max-width:100%; }
.row{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin:9px 0 0; }
.btn{ border:1px solid var(--bd2); background:var(--panel2); color:var(--tx); border-radius:9px;
  padding:6px 12px; font-size:.8rem; cursor:pointer; transition:.15s; font-weight:600; }
.btn:hover{ background:var(--panel3); border-color:var(--cy); transform:translateY(-1px); }
.btn:active{ transform:none; }
.btn.pri{ background:linear-gradient(94deg,#0b5f8a,#4c2fa8); border-color:var(--cy); color:#fff; }
.btn.gr{ background:linear-gradient(94deg,#0d5c45,#186b52); border-color:#34d399; color:#eafff6; }
.btn.am{ background:linear-gradient(94deg,#6b4a09,#7a5310); border-color:#fbbf24; color:#fff5da; }
.btn.rd{ background:linear-gradient(94deg,#6f2033,#7d2740); border-color:#fb7185; color:#ffe9ee; }
.btn.sm{ padding:4px 9px; font-size:.73rem; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; transform:none; }
/* 프리셋 버튼(a = g · (나)가속 · GPS 처럼 「지금 고른 값」이 있는 버튼)의 선택 표시.
   머리말의 .lv-pill / .th-pill 과 같은 aria-pressed 규약을 그대로 쓴다.
   JS 에서는 presetGroup() 으로 켜고 끈다. */
.btn[aria-pressed="true"]{ background:linear-gradient(92deg,#0e3a56,#2b2160); border-color:var(--cy);
  color:#fff; font-weight:700; box-shadow:0 0 0 1px var(--cy) inset; }
.btn[aria-pressed="true"]::before{ content:'\2713\00a0'; font-weight:700; }
.chk{ display:inline-flex; align-items:center; gap:6px; font-size:.8rem; color:var(--mut); cursor:pointer; }
.chk input{ accent-color:var(--cy); width:15px; height:15px; }

/* ---------- 캔버스 ---------- */
.cv-wrap{ position:relative; background:var(--cvbg,#070c18); border:1px solid var(--bd); border-radius:12px; overflow:hidden; }
.cv-wrap canvas{ display:block; width:100%; }
.cv-tools{ position:absolute; top:7px; right:7px; display:flex; gap:5px; z-index:3; }
.cv-cap{ font-size:.74rem; color:var(--mut); padding:5px 9px 7px; border-top:1px solid var(--bd);
  background:var(--panel2); }   /* 배경·글자 모두 테마 변수 — 밝은 테마에서도 대비 확보 */

/* ---------- 계측 표시 ---------- */
.kv{ display:grid; grid-template-columns:repeat(auto-fit,minmax(116px,1fr)); gap:7px; margin-top:9px; }
.kv .cell{ background:var(--panel2); border:1px solid var(--bd); border-radius:9px; padding:6px 9px; }
.kv .cell .k{ font-size:.68rem; color:var(--dim); display:block; }
.kv .cell .v{ font-size:.92rem; font-weight:800; color:var(--cy); font-variant-numeric:tabular-nums; word-break:break-all; }
.kv .cell.g .v{color:var(--gr);} .kv .cell.a .v{color:var(--am);} .kv .cell.v2 .v{color:var(--vi);}
.kv .cell.r .v{color:var(--rd);}

/* ---------- 오수벨 선행조직자 ---------- */
.organizer{ background:linear-gradient(96deg,rgba(167,139,250,.13),rgba(56,189,248,.07));
  border:1px solid #4a3a86; border-left:4px solid var(--vi); border-radius:0 12px 12px 0;
  padding:10px 13px; margin-bottom:12px; font-size:.85rem; }
.organizer .ot{ font-weight:800; color:var(--viTx); font-size:.82rem; margin-bottom:3px; }
.bridge{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:7px; font-size:.76rem; }
.bridge .st{ background:var(--panel2); border:1px solid var(--bd); border-radius:8px; padding:3px 9px; }
.bridge .st.old{ border-color:#7d3446; color:#ffb0bf; }
.bridge .st.new{ border-color:#2b6b48; color:#7ee0a8; }
.bridge .ar{ color:var(--dim); }

/* ---------- POE ---------- */
.poe{ background:rgba(251,191,36,.06); border:1px solid #7a5c17; border-radius:12px; padding:11px 13px; margin:12px 0; }
.poe .pq{ font-weight:700; font-size:.88rem; color:var(--amTx); margin:6px 0 8px; }
.opts{ display:grid; gap:6px; }
.opt{ text-align:left; background:var(--panel2); border:1px solid var(--bd); color:var(--tx);
  border-radius:9px; padding:7px 11px; font-size:.82rem; cursor:pointer; transition:.15s; }
.opt:hover{ border-color:var(--am); background:var(--panel3); }
.opt.sel{ border-color:var(--am); box-shadow:0 0 0 1px rgba(251,191,36,.35) inset; }
.opt.ok{ border-color:var(--gr); background:rgba(52,211,153,.14); color:var(--okTx); }
.opt.no{ border-color:var(--rd); background:rgba(251,113,133,.13); color:var(--rdTx); }
.opt .mk{ font-weight:800; margin-right:6px; color:var(--am); }
.poe-exp{ display:none; margin-top:10px; border-top:1px dashed var(--bd2); padding-top:9px; font-size:.83rem; color:var(--tx); }
.poe-exp.on{ display:block; }
.poe-exp .et{ color:var(--gr); font-weight:800; font-size:.8rem; margin-bottom:3px; }

/* ---------- 비고츠키 힌트(비계) ---------- */
.hintbox{ background:rgba(52,211,153,.06); border:1px solid #2b6b48; border-radius:12px; padding:10px 13px; margin:12px 0; }
.hint-head{ display:flex; align-items:center; justify-content:space-between; gap:9px; flex-wrap:wrap; }
.hint-title{ font-weight:800; font-size:.82rem; color:var(--okTx); }
.hint-list{ margin-top:8px; display:grid; gap:6px; }
.hint-item{ background:var(--panel2); border:1px solid var(--bd); border-left:3px solid var(--gr);
  border-radius:0 9px 9px 0; padding:6px 11px; font-size:.81rem; color:var(--tx); animation:fade .25s; }

/* ---------- 오개념 박스 ---------- */
.misc{ background:rgba(251,113,133,.07); border:1px solid #7d3446; border-radius:12px; padding:10px 13px; margin:12px 0; font-size:.83rem;}
.misc .mt{ font-weight:800; color:var(--rdTx); font-size:.81rem; margin-bottom:4px; }
.misc .fix{ color:var(--okTx); }

/* ---------- 표 ---------- */
.tblwrap{ overflow-x:auto; margin-top:9px; border:1px solid var(--bd); border-radius:10px; max-height:260px; overflow-y:auto;}
table.tbl{ border-collapse:collapse; width:100%; font-size:.78rem; min-width:330px; }
table.tbl th,table.tbl td{ border-bottom:1px solid var(--bd); padding:5px 9px; text-align:right;
  font-variant-numeric:tabular-nums; white-space:nowrap; }
table.tbl th{ background:var(--panel3); color:var(--tx2); font-weight:700; text-align:right; position:sticky; top:0;}
table.tbl td:first-child,table.tbl th:first-child{ text-align:left; }
table.tbl tr:last-child td{ border-bottom:none; }
table.tbl tbody tr:hover{ background:rgba(56,189,248,.06); }

/* 타임라인 */
.tline{ display:grid; grid-template-columns:repeat(auto-fit,minmax(176px,1fr)); gap:9px; margin-top:10px; }
.tl-card{ background:var(--panel2); border:1px solid var(--bd); border-top:3px solid var(--cy);
  border-radius:0 0 11px 11px; padding:9px 11px; cursor:pointer; transition:.16s; text-align:left; }
.tl-card:hover{ transform:translateY(-2px); border-color:var(--bd2); background:var(--panel3); }
.tl-card .yr{ font-size:.72rem; color:var(--am); font-weight:800; }
.tl-card .nm{ font-weight:800; font-size:.87rem; margin:1px 0 3px; color:var(--tx);}
.tl-card .ds{ font-size:.76rem; color:var(--mut); }
.tl-card .lim{ font-size:.73rem; color:var(--rdTx); margin-top:5px; }

/* 퀴즈 */
.qcard{ background:var(--panel2); border:1px solid var(--bd); border-radius:12px; padding:12px 14px; margin-bottom:11px; }
.qcard .qn{ font-size:.72rem; color:var(--am); font-weight:800; }
.qcard .qt{ font-weight:700; margin:3px 0 9px; font-size:.9rem; }
.prog{ height:8px; background:var(--panel2); border:1px solid var(--bd); border-radius:99px; overflow:hidden; }
.prog > i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--cy),var(--gr)); transition:width .35s; }

/* 오비탈 규칙 판정 */
.rulebox{ display:grid; gap:5px; margin-top:9px; }
.rule{ font-size:.79rem; padding:5px 10px; border-radius:8px; border:1px solid var(--bd); background:var(--panel2); }
.rule.ok{ border-color:#2b6b48; color:#9ff0c8; background:rgba(52,211,153,.09);}
.rule.no{ border-color:#7d3446; color:#ffb0bf; background:rgba(251,113,133,.09);}

/* 전자배치 박스 */
.orbbox{ display:flex; flex-wrap:wrap; gap:9px; margin-top:9px; }
.ob{ text-align:center; }
.ob .cells{ display:flex; gap:2px; }
.ob .c{ width:27px; height:21px; border:1px solid var(--bd2); border-radius:4px; background:var(--panel2);
  font-size:.74rem; display:flex; align-items:center; justify-content:center; color:var(--am); letter-spacing:-1px;}
.ob .lb{ font-size:.7rem; color:var(--mut); margin-top:2px; }

/* 하단 이동 바 */
.stepnav{ display:flex; align-items:center; justify-content:space-between; gap:9px; margin-top:6px;
  border-top:1px solid var(--bd); padding-top:11px; }
.stepnav .ct{ font-size:.76rem; color:var(--dim); }
.invis{ visibility:hidden; }
.foot{ text-align:center; color:var(--dim); font-size:.73rem; padding:18px 14px 26px; }

/* 난이도 필터 */
body[data-level="mid"] .lv-high, body[data-level="mid"] .lv-uni{ display:none !important; }
body[data-level="high"] .lv-uni{ display:none !important; }
.mono{ font-family:ui-monospace,"Consolas","D2Coding",monospace; font-size:.78rem; }

/* ---------- 실험 장치 도해(SVG) ---------- */
.figwrap{ background:#070c18; border:1px solid var(--bd); border-radius:12px; padding:8px 8px 2px;
  overflow-x:auto; overflow-y:hidden; margin-top:9px; }
.fig{ display:block; width:100%; height:auto; min-width:470px; }
.fig text{ font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif; }
.figcap{ font-size:.75rem; color:var(--dim); padding:6px 2px 0; text-align:center; }
@media (max-width:760px){
  .figcap::before{ content:'↔ 그림은 좌우로 밀어서 볼 수 있어요 · '; color:var(--am); }
}

/* ---------- 기구 설명 카드 ---------- */
.parts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(208px,1fr)); gap:8px; margin-top:9px; }
.part{ background:var(--panel2); border:1px solid var(--bd); border-radius:10px; padding:8px 11px; font-size:.8rem; color:var(--softTx); }
.part b{ color:var(--cy); display:block; font-size:.83rem; margin-bottom:2px; }
.part i{ color:var(--am); font-style:normal; font-weight:700; }

/* ---------- 실험 절차 ---------- */
.steps{ counter-reset:st; display:grid; gap:7px; margin-top:9px; }
.step{ background:var(--panel2); border:1px solid var(--bd); border-radius:10px;
  padding:8px 11px 8px 40px; position:relative; font-size:.83rem; color:var(--softTx); }
.step::before{ counter-increment:st; content:counter(st); position:absolute; left:10px; top:7px;
  width:21px; height:21px; border-radius:50%; background:linear-gradient(94deg,#0b5f8a,#4c2fa8);
  color:#fff; font-size:.72rem; font-weight:800; display:flex; align-items:center; justify-content:center; }
.step b{ color:var(--cy); }

/* ---------- 쉽게 이해하기(비유) ---------- */
.easy{ background:linear-gradient(96deg,rgba(52,211,153,.11),rgba(56,189,248,.05));
  border:1px solid #2b6b48; border-left:4px solid var(--gr); border-radius:0 12px 12px 0;
  padding:10px 13px; margin:12px 0; font-size:.86rem; }
.easy .et{ font-weight:800; color:var(--okTx); font-size:.83rem; margin-bottom:3px; }
.easy b{ color:var(--okTx); }
.compare{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:8px; margin-top:8px; }
