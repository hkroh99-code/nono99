<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>학생용 활동지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  .list { display: grid; gap: .6rem; }
  .row { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; gap: .3rem 1rem; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .8rem 1rem; text-decoration: none; color: var(--ink); }
  .row:hover { border-color: var(--accent); }
  .row__n { font-family: var(--font-mono); font-weight: 600; font-size: 1.3rem; }
  .row__t { font-weight: 700; }
  .row__d { font-size: var(--step--1); color: var(--ink-2); grid-column: 2; }
  .row .badge { grid-row: 1; grid-column: 3; }
  .lv-basic .row__n { color: var(--lv-basic); } .lv-adv .row__n { color: var(--lv-adv); } .lv-int .row__n { color: var(--lv-int); }
  @media (max-width: 520px) { .row { grid-template-columns: 2.4rem minmax(0,1fr); } .row .badge { grid-column: 2; grid-row: auto; justify-self: start; } }
</style>
</head>
<body data-page="student" data-root="../">
<main class="page">
  <header class="doc-head">
    <div class="doc-head__meta"><span class="badge badge--student">학생용</span></div>
    <h1>학생용 활동지</h1>
    <p class="lead">주제마다 생각 열기, 핵심 개념, 실물 실험, 3D 모의실험, 확인 문제, 업그레이드 도전이 한 장에 들어 있습니다. 입력한 답은 이 기기에 자동 저장됩니다.</p>
  </header>
  
  <div class="list" id="list"></div>
</main>
<script src="../assets/js/common.js"></script>
<script>
(function () {
  var T = window.CERNClass.TOPICS, L = window.CERNClass.LEVELS, pad = window.CERNClass.pad;
  var D = ["블랙박스 탐구 · 물질 속으로 줌인 · 표준모형 갤러리", "구슬 산란 실험 · 3D 금박 산란실", "계단 모형 가속 · 선형가속기 위상 맞추기", "로렌츠 힘 그네 · 자기장 속 궤적과 싱크로트론", "구름상자 만들기 · 3D CMS 검출기 탐험", "우주선 뮤온 계수 · 뮤온 비행 실험실", "2차원 충돌 영상 분석 · 붕괴 재구성 실험실", "가속기 설계 제안서 · LHC 가상 운전실", "사건 카드 분류 · 3D 이벤트 디스플레이", "실제 CMS 데이터 분석 · 발견 보고서"];
  document.getElementById("list").innerHTML = T.map(function (t) {
    return '<a class="row lv-' + t.level + '" href="t' + pad(t.n) + '.html"><span class="row__n">' + pad(t.n) + '</span><span class="row__t">' + t.title + '</span>' +
      '<span class="badge ' + L[t.level].cls + '">' + L[t.level].name + '</span><span class="row__d">' + D[t.n - 1] + '</span></a>';
  }).join("");
})();
</script>
</body>
</html>
